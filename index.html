арианты."],"c":[3]},{"q":"Общее положение по тактике в позиционной обороне в городских условиях?","o":["выбор оптимальной позиции для обороны.","выбор в качестве укрытия господствующего места.","распределение сектора наблюдения и ведения огня.","все варианты."],"c":[3]}]},{"name":"Тактическая медицина","qs":[{"q":"Комплекс срочных мер, направленных на спасение жизни человека (без использования специальных медицинских инструментов, оборудования, лекарств и проведения медицинских манипуляций, может оказывать любой человек) – это:","o":["первая доврачебная помощь;","первая врачебная помощь;","первая помощь;","первая медицинская помощь."],"c":[2]},{"q":"Перечень состояний, при которых оказывается первая помощь, утвержден:","o":["приказом Минздравсоцразвития России от 3 мая 2024 г. № 220н;","Федеральным законом от 21 ноября 2011 года № 323-ФЗ;","приказом МВД России от 30 апреля 2012 г. № 389;","приказом Минздравсоцразвития России от 15 мая 2012 г. № 543н."],"c":[0]},{"q":"Какие из перечисленных мероприятий относятся к оказанию первой помощи?","o":["Восстановление проходимости дыхательных путей.","Применение лекарственных препаратов.","Удаление видимых инородных тел из раны брюшной, грудной или черепной полости с дальнейшим наложением давящей повязки.","Вправление выпавших органов брюшной полости."],"c":[0]},{"q":"Если Вы стали свидетелем неотложной ситуации и готовы помочь, первое, что необходимо сделать, это:","o":["осмотреть пострадавшего на предмет опасных для жизни состояний;","позвать помощника;","вызвать экстренные службы;","осмотреть место происшествия на предмет имеющейся опасности для вас и пострадавшего."],"c":[3]},{"q":"Что относится к мероприятиям по оценке обстановки и обеспечению безопасных условий для оказания первой помощи?","o":["Определение наличия сознания у пострадавшего.","Устранение угрожающих факторов для жизни и здоровья.","Придание пострадавшему оптимального положения тела.","Контроль состояния пострадавшего (дыхание, кровообращение, сознание) и оказание психологической поддержки."],"c":[1]},{"q":"Когда производится вызов скорой медицинской помощи?","o":["Непосредственно после оказания первой помощи пострадавшим.","Сразу после определения наличия пострадавших на месте происшествия.","После определения примерного количества и состояния пострадавших.","Сразу же по прибытии на место происшествия."],"c":[2]},{"q":"Укажите последовательность сведений, которые необходимо сообщить диспетчеру при вызове скорой медицинской помощи в случае ДТП:","o":["место происшествия, что произошло; число пострадавших и тяжесть их состояния; какая помощь оказывается;","место происшествия, что произошло; какая помощь оказывается;","число пострадавших и тяжесть их состояния; место происшествия; какую помощь собираетесь оказывать;","место происшествия; что произошло; какая помощь оказывается; число пострадавших и тяжесть их состояния."],"c":[0]},{"q":"В мероприятия по оценке обстановки и обеспечению безопасных условий для оказания первой помощи не входит:","o":["определение угрожающих факторов для жизни и здоровья пострадавшего;","устранение угрожающих факторов для жизни и здоровья;","введение противостолбнячной сыворотки;","прекращение действия повреждающих факторов на пострадавшего."],"c":[2]},{"q":"Кому в первую очередь будет оказываться первая помощь в «красной зоне»?","o":["Раненому без сознания.","Раненому в сознании, не имеющему возможности выполнять боевую задачу.","Раненому в сознании, имеющему возможность выполнять боевую задачу.","Нет верного ответа."],"c":[2]},{"q":"Как определить наличие дыхания у пострадавшего?","o":["Поднести к носу пострадавшего поверхность зеркала, очков, часов в течение 10 секунд.","Поднести пальцы своих рук к ротовой полости пострадавшего.","Наклониться щекой и ухом ко рту и носу пострадавшего и в течение 10 секунд попытаться услышать его дыхание, почувствовать выдыхаемый воздух на своей щеке и увидеть движения грудной клетки у пострадавшего.","Наклониться щекой и ухом ко рту и носу пострадавшего и в течение 10 секунд попытаться увидеть движения грудной клетки у пострадавшего."],"c":[2]},{"q":"При восстановлении проходимости дыхательных путей необходимо:","o":["взять пострадавшего за шею и приподнять;","перевернуть на бок;","одну руку положить на лоб пострадавшего, 2-мя пальцами другой взять за подбородок и запрокинуть голову;","открыть рот пострадавшему и потянуть за язык немного вперед."],"c":[2]},{"q":"В случае появления у пострадавшего признаков жизни следует:","o":["отменить приезд бригады скорой помощи;","придать пострадавшему устойчивое боковое положение;","оставить пострадавшего в покое;","посадить пострадавшего."],"c":[1]},{"q":"Действия при частичном нарушении проходимости дыхательных путей у взрослого человека:","o":["предложить пострадавшему покашлять;","предложить пострадавшему выпить воды;","предложить пострадавшему вытащить застрявший кусок еды;","предложить пострадавшему лекарство."],"c":[0]},{"q":"Сердечно-легочная реанимация проводится когда:","o":["отсутствует сознание;","отсутствует дыхание и сердечная деятельность;","отсутствует речь при сохраненном сознании;","отсутствует координация движений."],"c":[1]},{"q":"Реанимационные мероприятия взрослого человека проводятся, чередуя:","o":["25 надавливаний на грудину с 2 вдохами искусственного дыхания;","30 надавливаний на грудину с 2 вдохами искусственного дыхания;","30 надавливаний на грудину с 1 вдохом искусственного дыхания;","15 надавливаний на грудину с 2 вдохами искусственного дыхания."],"c":[1]},{"q":"СЛР выполняется:","o":["на жесткой поверхности;","на диване или кровати;","на пружинящей, ровной поверхности;","на жесткой, ровной поверхности."],"c":[3]},{"q":"В случае, если инородное тело полностью нарушило проходимость дыхательных путей у пострадавшего, оказание первой помощи начинается:","o":["с просьбы пострадавшему прокашляться;","с наклона пострадавшего вперед и нанесения 5-ти ударов между лопатками;","с 5 ударов по грудине пострадавшего;","с просьбы пострадавшему выпить воды."],"c":[0]},{"q":"При обзорном осмотре пострадавшего оценивают следующее:","o":["показатели артериального давления;","пульс на лучевой артерии;","наличие кровотечений;","наличие переломов."],"c":[2]},{"q":"После наложения жгута пишется записка:","o":["с указанием фамилии пострадавшего;","с указанием времени наложения жгута;","с указанием повреждений, обнаруженных у пострадавшего;","с указанием артериального давления пострадавшего."],"c":[1]},{"q":"Вместо жгута можно использовать:","o":["давящую повязку;","закрутку;","холод к ране;","компресс."],"c":[1]},{"q":"Кровотечение, характеризующееся вытеканием крови пульсирующей струей, имеющей алую окраску:","o":["артериальное;","венозное;","паренхиматозное;","капиллярное."],"c":[0]},{"q":"При проникающем ранении груди самое важное – это:","o":["попытаться остановить кровотечение давящей повязкой;","не прикасаться к ране во избежание причинения вреда;","наложить на рану груди повязку, не пропускающую воздух;","своевременно дать пострадавшему обезболивающее средство."],"c":[2]},{"q":"Что запрещается делать при оказании первой помощи при закрытой травме живота?","o":["Прикладывать холод к месту травмы.","Давать пить пострадавшему.","Давать пострадавшему обезболивающие препараты.","Придать пострадавшему положение тела на спине с валиком под полусогнутыми и сведенными ногами."],"c":[1,2]},{"q":"Что необходимо сделать при оказании первой помощи при травме головы с нахождением в ране инородного предмета:","o":["зафиксировать инородный предмет, обложив салфетками или бинтами, после этого наложить повязку;","зафиксировать инородный предмет, дать пострадавшему ненаркотическое обезболивающее, наложить повязку;","попытаться извлечь инородный предмет из раны;","нет верного ответа."],"c":[0]},{"q":"Что не входит в классификацию механических ран по характеру повреждения?","o":["Резаные раны.","Колотые раны.","Ушибленные раны.","Сочетанные раны."],"c":[3]},{"q":"Первая помощь при ожоге заключается в следующем:","o":["смазать ожог мазью, охладить под струей холодной воды или приложением холода, наложить повязку;","охладить под струей холодной воды или приложением холода, наложить нетугую повязку, дать теплое питье;","охладить под струей холодной воды или приложением холода, волдыри вскрыть и обработать рану антисептиком, наложить стерильную повязку, дать теплое питье;","смазать ожог мазью или жиром, наложить асептическую повязку, дать теплое питье."],"c":[1]},{"q":"В случае развития отморожения конечности наиболее важно:","o":["тепло укутать пострадавшего;","наложить на конечность термоизолирующую повязку;","как можно скорее поместить отмороженную конечность в теплую воду;","растереть конечность шерстяной тканью."],"c":[1]},{"q":"Общее воздействие пониженной температуры окружающей среды на все тело человека называется:","o":["отморожение;","обморожение;","переохлаждение;","гипертермия."],"c":[2]},{"q":"Опасными для жизни пострадавшего являются поверхностные ожоги площадью:","o":["более 15% тела;","более 50% тела;","не менее 50% тела;","нет верного ответа."],"c":[0]},{"q":"Наблюдение за пострадавшим, которому оказана первая помощь, осуществляется:","o":["до доставки пострадавшего в медицинскую организацию;","до прибытия скорой медицинской помощи;","до улучшения его состояния;","до момента передачи его бригаде скорой медицинской помощи."],"c":[3]},{"q":"Придание устойчивого бокового положения пострадавшему следует начать:","o":["с расположения одной руки пострадавшего под прямым углом к его телу;","с поворота нижней части его тела на бок;","с расположения руки пострадавшего тыльной стороной ладони к его щеке;","с расстегивания воротника рубашки, ослабления галстука и т. д."],"c":[0]},{"q":"После оказания первой помощи до прибытия бригады скорой медицинской помощи необходимо, прежде всего, осуществлять следующие действия:","o":["продолжать звонить диспетчеру скорой медицинской помощи для определения необходимости в самостоятельной транспортировке пострадавших;","продолжать контролировать состояние пострадавших и оказывать им психологическую поддержку;","для скорейшего оказания медицинской помощи пострадавшим транспортировать их попутным или служебным автотранспортом навстречу бригаде скорой медицинской помощи;","подготовить попутный или служебный автотранспорт к госпитализации пострадавших."],"c":[1]},{"q":"Пострадавшему, находящемуся в сознании и имеющему признаки кровопотери, следует придать следующее положение:","o":["устойчивое боковое положение;","полусидячее положение;","положение на спине с приподнятыми ногами;","положение на спине с согнутыми и разведенными ногами."],"c":[0]},{"q":"Перемещение пострадавшего с подозрением на травму позвоночника следует выполнять следующим способом:","o":["вдвоем за руки и за ноги;","на твердой ровной поверхности (щит);","волоком на прочной ткани;","вдвоем на замке из трех рук с поддержкой за спиной."],"c":[1]},{"q":"Переноску в одиночку волоком не рекомендуется применять для пострадавших со следующими травмами:","o":["грудной клетки;","живота;","головы;","нижних конечностей."],"c":[3]},{"q":"Целью придания пострадавшему оптимального положения тела является:","o":["повышение удобства для человека, оказывающего первую помощь;","обеспечение доступа для наложения повязок, кровоостанавливающих жгутов и т.д.;","обеспечение пострадавшему комфорта, уменьшающего степень его страданий;","предупреждение или снижение риска самопроизвольного перемещения тела пострадавшего."],"c":[2]},{"q":"Какой признак не входит в систему критериев сортировки раненых?","o":["Оценка возможности передвигаться.","Оценка частоты дыхания.","Оценка скорости капиллярного восполнения.","Оценка артериального давления."],"c":[3]}]},{"name":"Морально-психологическая подготовка","qs":[{"q":"Выбери правильный текст второго куплета Государственного гимна Российской Федерации:","o":["От Южных морей до полярного края\nРаскинулись наши леса и поля.\nОдна ты на свете! Одна ты такая-\nХранимая богом родная земля!","От Южных морей до полярного края\nРаскинулись горы, леса и поля.\nОдна ты на свете! Одна ты такая-\nХранимая богом родная страна!","От Южных морей до полярного края\nРаскинулись наши леса и луга.\nМогучая воля, великая слава -\nХранимая богом родная страна!","От Южных морей до полярного края\nРаскинулись реки, леса и поля.\nОдна ты на свете! Одна ты такая-\nХранимая Богом родная земля!"],"c":[0]},{"q":"С какого года начинается история ветеранского движения в Министерстве внутренних дел?","o":["с 1962 г.;","с 1972 г.;","с 1982 г.;","с 1992 г."],"c":[0]},{"q":"Послание Президента Российской Федерации Федеральному Собранию Российской Федерации является…?","o":["Нормативным правовым актом;","Политическим актом с элементами распорядительных функций;","Документом стратегического планирования;","Актом применения права."],"c":[1]},{"q":"Каковы основные принципы морали, реализуемые в деятельности сотрудников ОВД?","o":["Одобрение, согласие;","Законность, гуманизм, справедливость;","Порицание, несогласие;","Добросовестное отношение к труду, самокритика."],"c":[1]},{"q":"Согласно Кодексу этики и служебного поведения сотрудников органов внутренних дел Российской Федерации для сотрудника неприемлемо:","o":["употребление алкогольных напитков в отпуске, служебной командировке и на рабочем месте, а также курение табака в запрещенных местах;","употребление алкогольных напитков накануне и во время выполнения служебных обязанностей, курение табака в запрещенных местах;","употребление алкогольных напитков, курение табака, где бы то ни было;","употребление алкогольных напитков во время выполнения служебных обязанностей и не менее чем за неделю до выхода из очередного отпуска, курение табака в непредусмотренных для этого местах."],"c":[1]},{"q":"Укажите дату начала Великой Отечественной войны 1941-1945 г.г.:","o":["2 сентября 1941 г.;","22 июня 1941 г.;","28 июля 1914 г.;","1 сентября 1939 г."],"c":[1]},{"q":"Группа объединенных общими целями и задачами людей, достигшая в процессе совместной деятельности высокого уровня развития – это?:","o":["Толпа;","Неформальная группировка;","Коллектив;","Нет правильного ответа."],"c":[2]},{"q":"Кто из перечисленных ниже сотрудников органов внутренних дел Вологодской области, погибших при выполнении служебных обязанностей, удостоен звания Герой Российской Федерации (посмертно)?","o":["Авдюнин Владимир Александрович;","Клюев Валерий Юрьевич;","Перец Сергей Владимирович;","Пастухов Леонид Львович."],"c":[2]},{"q":"Какой день вошел в историю России как дата создания регулярной российской полиции?","o":["10 ноября 1917 года;","29 сентября 1937 года;","5 июня 1718 года;","10 ноября 1718 года."],"c":[2]},{"q":"Борьбу с терроризмом непосредственно осуществляет:","o":["Комитет финансового мониторинга;","Федеральная служба безопасности Российской Федерации;","Интерпол;","Все вышеперечисленные."],"c":[1]},{"q":"Назовите дату распада Союза Советских Социалистических Республик:","o":["Декабрь 1991 года;","Январь 1991 года;","Март 1993 года;","Декабрь 1988 года."],"c":[0]},{"q":"Кто в период 1990-1991 г.г. являлся Президентом СССР?","o":["Борис Николаевич Ельцин;","Михаил Сергеевич Горбачев;","Владимир Владимирович Путин."],"c":[1]},{"q":"Назовите дату учреждения физкультурно-спортивного общества «Динамо»?","o":["20 апреля 1933 года;","11 марта 1918 года;","10 ноября 1920 года;","18 апреля 1923 года."],"c":[3]},{"q":"Назовите период оборонительной операции Сталинградской битвы Великой Отечественной войны 1941-1945 г.г. ?","o":["17 июля – 18 ноября 1942 г;","17 июля – 18 ноября 1945 г;","17 июля – 18 ноября 1939 г;","27 августа – 19 декабря 1942 г."],"c":[0]},{"q":"Назовите период стратегической наступательной операции советских войск по окружению и разгрому войск противника под Сталинградом в Великой Отечественной войне 1941-1945 г.г. ?","o":["19 ноября 1942 г. – 2 февраля 1943 г;","19 ноября 1945 г. – 2 февраля 1945 г;","19 ноября 1939 г. – 2 февраля 1939 г;","17 июля 1942 г. – 2 ноября 1942 г."],"c":[0]},{"q":"Морально-психологическая подготовка - это:","o":["Вид воспитательной работы;","Вид морально-психологического обеспечения;","Форма проведения индивидуальной воспитательной работы;","Метод воспитательной работы."],"c":[0]},{"q":"Когда и кем принята Конституция Российской Федерации?","o":["Принята всенародным голосованием 12.12.1993 с изменениями, одобренными в ходе общероссийского голосования 01.07.2020 года;","Принята всенародным голосованием 12.12.1995 с изменениями, одобренными в ходе общероссийского голосования 01.07.2020 года;","Принята всенародным голосованием 12.12.1998 с изменениями, одобренными в ходе общероссийского голосования 01.07.2020 года;","Принята всенародным голосованием 04.11.1993 с изменениями, одобренными в ходе общероссийского голосования 01.07.2020 года."],"c":[0]},{"q":"Какое из перечисленных свойств не присуще характеристике гражданина - патриота своей страны?","o":["Готовность к объединению для решения лично и общественно значимых проблем;","Умение любить свою Родину;","Высокомерие, взгляд на окружающих сверху;","Неприятие агрессии, жесткости, насилия над личностью."],"c":[2]},{"q":"Один из принципов федерализма в Российской Федерации:","o":["Государственная целостность;","Федеральное управление республиками;","Неравенство субъектов Российской Федерации."],"c":[0]},{"q":"Что относится к интересам общества в соответствии с концепцией национальной безопасности?","o":["Право на работу;","Самостоятельность;","Суверенитет и территориальная независимость России;","Право интеллектуального достояния."],"c":[2]},{"q":"Выбери правильный текст первого куплета Государственного гимна Российской Федерации:","o":["Россия – священная наша держава,\nРоссия – великая наша страна.\nОдна ты на свете! Одна ты такая-\nХранимая богом родная земля!","Россия – великая наша держава,\nРоссия – священная наша земля.\nМогучая воля, великая слава -\nТвое достоянье на все времена!","Россия – священная наша держава,\nРоссия – любимая наша страна.\nМогучая сила, великая гордость -\nТвое достоянье на все времена!","Россия – священная наша держава,\nРоссия – любимая наша страна.\nМогучая воля, великая слава -\nТвое достоянье на все времена!"],"c":[3]},{"q":"Кто был первым председателем Российского Совета ветеранов органов внутренних дел и внутренних войск?","o":["Б.Т. Шумилин;","И.А. Коннов;","З.И. Ефремова;","И.Ф. Шилов."],"c":[0]},{"q":"Что служит символом чести и достоинства, доблести и славы сотрудника органов внутренних дел?","o":["Знамя органа внутренних дел;","Парадный китель с орденами и медалями;","Герб Российской Федерации;","Государственный гимн Российской Федерации."],"c":[0]},{"q":"Как звучит «золотое правило нравственности»?","o":["Говори и поступай всегда так, как сам того желаешь;","Действуй и поступай всегда только так, как того хотят окружающие тебя люди;","Не делай другим того, чего не желаешь себе;","Оказывай помощь другим, помогут и тебе."],"c":[2]},{"q":"Основным документом, определяющим ориентиры профессионально- нравственного поведения сотрудника органов внутренних дел Российской Федерации является:","o":["Приказ МВД России от 26 июня 2020 г. № 460 «Об утверждении Кодекса этики и служебного поведения сотрудников органов внутренних дел Российской Федерации»;","Приказ МВД России от 25 декабря 2020 г. № 900 «Об утверждении Кодекса чести сотрудников органов внутренних дел Российской Федерации»;","Приказ МВД России от 22 июля 2011 г. № 870 «Об утверждении Кодекса этики и служебного поведения федеральных государственных гражданских служащих системы Министерства внутренних дел Российской Федерации»."],"c":[0]},{"q":"Укажите дату начала Второй мировой войны:","o":["2 сентября 1941 г.;","22 июня 1941 г.;","28 июля 1914 г.;","1 сентября 1939 г."],"c":[3]},{"q":"Под социально-психологическим климатом в коллективе понимается?","o":["Доминирующее настроение членов коллектива;","Качественная характеристика межличностных отношений, проявляющихся в виде совокупности нравственных и психологических условий, способствующих или препятствующих продуктивной совместной деятельности и всестороннему развитию личности сотрудника в группе;","Психо-эмоциональное состояние сотрудников в коллективе;","Взаимные симпатии членов коллектива друг к другу и удовлетворенность стилем управленческой деятельности."],"c":[1]},{"q":"Кто из перечисленных лиц не относится к сотрудникам органов внутренних дел Вологодской области, погибшим при выполнении служебных обязанностей?","o":["Тиньков Валерий Анатольевич;","Онькин Александр Сергеевич;","Перец Сергей Владимирович;","Пастухов Леонид Львович."],"c":[0]},{"q":"Регулярная полиция в России была образована в:","o":["1700 году после восстания стрельцов;","1715 году с учреждением Полицмейстерской канцелярии Санкт-\nПетербурга;","1722 году при реорганизации приказов в коллегии;","1718 году при назначении генерал-полицмейстера Санкт- Петербурга;","1802 году в связи с образованием МВД Российской империи."],"c":[3]},{"q":"С целью недопущения конфликта интересов, личной заинтересованности, сотруднику ОВД запрещено заниматься:","o":["Педагогической деятельностью;","Научной деятельностью;","Благотворительной деятельностью;","Предпринимательской деятельностью."],"c":[3]},{"q":"Какие нарушения служебной дисциплины относятся к категории грубых?","o":["Сокрытие сотрудником фактов обращения к нему каких-либо лиц в целях склонения его к совершению коррупционного правонарушения;","Неявка сотрудника без уважительной причины на заседание аттестационной комиссии для прохождения аттестации;","Разглашение сотрудником сведений, составляющих государственную и иную охраняемую законом тайну, конфиденциальной информации (служебной тайны), ставших ему известными в связи с выполнением служебных обязанностей, если это не влечет за собой уголовную ответственность;","Все перечисленные."],"c":[3]},{"q":"В 2026 году Всероссийское физкультурно-спортивное общество «Динамо» отмечает свое …?","o":["90-летие;","150-летие;","200-летие;","103-летие."],"c":[3]},{"q":"Назовите лозунг Всероссийского физкультурно-спортивного общества «Динамо»?","o":["«Все побежали и я побежал»;","«Сила в движении»;","«Движемся вместе»;","«Быстрее, выше, сильнее»."],"c":[1]},{"q":"В настоящее время и с 2019 года председателем Всероссийского физкультурно-спортивного Общества «Динамо» является?","o":["Владимир Александрович Колокольцев;","Анатолий Николаевич Гулевский;","Владимир Леонидович Кубышко;","Андрей Петрович Ларионов."],"c":[1]},{"q":"К наиболее распространенным причинам служебных конфликтных ситуаций относятся:","o":["Несовместимость в силу личностных, возрастных и других различий;","Личностные характеристики отдельных людей – черты характера;","Специфические особенности поведения, отношение к труду, коллективу;","Все ответы правильные."],"c":[3]},{"q":"Что не относится к виду воспитательной работы?","o":["Морально-психологическая подготовка;","Культурно-просветительская работа;","Психологическая работа;","Работа по поддержанию служебной дисциплины и законности."],"c":[2]},{"q":"Что из перечисленного не относится к направлениям гражданско- патриотического воспитания?","o":["Духовно-нравственное;","Историко-краеведческое;","Эмоционально-волевое;","Гражданско-правовое."],"c":[2]},{"q":"Кто в настоящее время является председателем Вологодской региональной организации всероссийского физкультурно-спортивного общества «Динамо»?","o":["Серов Павел Юрьевич;","Штатнов Михаил Леонидович;","Оботуров Алексей Владимирович."],"c":[1]},{"q":"Найдите в приведенном ниже списке позицию, характеризующую Российскую Федерацию, как государство согласно Конституции:","o":["Конфессиональное государство;","Правовое государство;","Унитарное государство;","Монархия."],"c":[1]},{"q":"Задачами органов внутренних дел являются…","o":["Обеспечение безопасности личности;","Защита частной собственности;","Охрана общественного порядка;","Противодействие преступности;","Все вышеперечисленные."],"c":[4]},{"q":"Выбери правильный текст третьего куплета Государственного гимна Российской Федерации:","o":["Широкий простор для любви и для жизни\nГрядущие нам открывают года\nНам силу дает наша верность Отчизне.\nТак есть и так будет на все времена!","Широкий простор для мечты и для жизни\nГрядущие нам открывают года\nНам силу дает наша верность Отчизне.\nТак было, так есть и так будет всегда!","Широкий простор для мечты и для жизни\nГрядущие нам открывают года\nНам силу дает наша верность Отчизне.\nТак будет всегда и на все времена!","Широкий простор для мечты и для жизни\nГрядущие нам открывают года\nМы любим страну - дорогую Отчизну.\nТак было, так есть и так будет всегда!"],"c":[1]},{"q":"Какая дата объявлена Днем ветерана органов внутренних дел и внутренних войск России?","o":["29 сентября;","1 октября;","17 апреля;","8 мая."],"c":[2]},{"q":"Кто возглавляет Министерство внутренних дел Российской Федерации?","o":["Гостев Аркадий Александрович;","Колокольцев Владимир Александрович;","Шойгу Сергей Кужугетович;","Золотов Виктор Васильевич."],"c":[1]},{"q":"Что такое гражданственность?","o":["Жертвенность;","Сопричастность к судьбе Отечества;","Любовь к малой Родине;","Наличие гражданства."],"c":[1]},{"q":"Каким приказом утвержден Кодекс этики и служебного поведения сотрудников органов внутренних дел Российской Федерации:?","o":["Приказ МВД России от 26 июня 2020 г. № 460;","Приказ МВД России от 25 декабря 2020 г. № 900;","Приказ МВД России от 27 апреля 2020 г. № 245;","Приказ МВД России от 17 ноября 2020 г. № 777."],"c":[0]},{"q":"Назовите День воинской славы России – День снятия блокады Ленинграда?","o":["27 января 1944 г.;","2 февраля 1943 г.;","23 августа 1943 г.;","5 декабря 1941 г."],"c":[0]},{"q":"Благоприятный климат в служебном коллективе характеризуется:","o":["Способностью и готовностью совместными усилиями добиваться выполнения поставленных задач;","Отсутствием служебных традиций, сплачивающих коллектив;","Низкой степенью комфортности работы, социального самочувствия коллектива;","Недостаточным уровнем взаимоотношений, взаимопомощи и уважения."],"c":[0]},{"q":"Кто из перечисленных сотрудников органов внутренних дел Вологодской области, погибших при выполнении служебных обязанностей, награждены орденом Мужества (посмертно)?","o":["Лагунов Юрий Григорьевич;","Ставцев Евгений Михайлович;","Солодягин Сергей Владимирович;","Все вышеперечисленные."],"c":[3]},{"q":"Первым генерал-полицмейстером был:","o":["Кочубей;","Куракин;","Скорбеев;","Девиер."],"c":[3]},{"q":"Учебный год в системе занятий по морально-психологической подготовке продолжается:","o":["12 месяцев;","11 месяцев;","10 месяцев;","9 месяцев."],"c":[2]},{"q":"Какие нарушения служебной дисциплины относятся к категории грубых?","o":["Отказ или уклонение от прохождения медицинского освидетельствования (обследования);","Несоблюдение ограничений и запретов, установленных законодательством Российской Федерации;","Отсутствие по месту службы без уважительных причин;","Все перечисленные."],"c":[3]},{"q":"Назовите день воинской славы России – разгром советскими войсками немецко-фашистских войск в Сталинградской Битве?","o":["30 января 1943 года;","9 мая 1945 года;","2 февраля 1943 года;","30 августа 1941 года."],"c":[2]},{"q":"Назовите новые субъекты Российской Федерации, включенные в ее состав в 2022 году?","o":["Донецкая Народная Республика;","Луганская Народная Республика;","Запорожская и Херсонская области;","Все ответы верны."],"c":[3]},{"q":"Основные этические требования предписывают сотруднику?","o":["Вести себя достойно и вежливо, вызывая доверие и уважение граждан к органам внутренних дел, готовность оказывать им содействие;","Учитывать национальные обычаи и традиции, религиозные чувства граждан, культурные и иные особенности различных этнических, социальных групп, конфессий, способствовать согласию между ними;","Быть мужественным и решительным перед лицом опасности при пресечении правонарушений, защите граждан от преступных посягательств, проявлять готовность к оказанию помощи пострадавшим;","Все ответы верны."],"c":[3]},{"q":"Психологическая техника, основанная на многократном проговаривании желаемых установок, называется:","o":["Аутогенная тренировка;","Самовнушение;","Саморефлексия;","Нет правильного ответа."],"c":[1]},{"q":"Дайте понятие воспитательной работы.","o":["Воспитательная работа – основной вид морально-психологического обеспечения, представляющий собой целенаправленную деятельность по формированию у сотрудников комплекса профессиональных и нравственных качеств, обусловленных потребностями оперативно- служебной деятельности;","Воспитательная работа – это деятельность руководителей всех уровней, направленная на формирование у сотрудников профессиональных и нравственных качеств посредством проведения индивидуальных бесед;","Воспитательная работа – это деятельность по формированию у сотрудников моральной установки на верность Присяге сотрудника органов внутренних дел Российской Федерации, личной убежденности в приоритете защиты прав и свобод человека и гражданина, морально-психологической готовности к выполнению оперативно-служебных задач."],"c":[0]},{"q":"К какой базовой национальной ценности относится «мир во всем ире, многообразие культур и народов, международное сотрудничество»?","o":["Семья;","Природа;","Искусство и литература;","Человечество."],"c":[3]},{"q":"Найдите в приведенном ниже списке позицию, характеризующую Российскую Федерацию, как государство согласно Конституции:","o":["Монархия;","Республика;","Конфессиональное государство;","Унитарное государство."],"c":[1]},{"q":"Правовую основу противодействия терроризму в Российской Федерации составляет:","o":["Конституция Российской Федерации;","Общепризнанные принципы и нормы международного права;","Федеральный закон «О противодействии терроризму» от 06.03.2006 г. №35ФЗ;","Все вышеперечисленные нормативные правовые акты."],"c":[3]},{"q":"Под понятие «экстремистская деятельность» подпадают:","o":["Пропаганда и публичное демонстрирование нацистской атрибутики или символики, сходной с нацистской;","Уничтожение, повреждение или захват транспортных средств или иных объектов;","Посягательство на жизнь государственного или общественного деятеля;","Похищение людей и захват заложников."],"c":[0]},{"q":"Выбери правильный текст припева Государственного гимна Российской Федерации:","o":["Славься, Отечество наше свободное,\nБратских народов союз вековой,\nПредками данная мудрость народная!\nСлавься страна! Мы гордимся тобой!","Славься, Отечество наше свободное,\nДружбы народов союз вековой,\nПредками данная мудрость народная!\nСлавься страна! Мы гордимся тобой!","Славься, Отечество наше свободное,\nБратских народов союз вековой,\nПредками данная мудрость народная!\nСлавься страна! Мы идем за тобой!","Славься, Отечество, славься свободное,\nБратских народов союз вековой,\nПредками данная мудрость народная!\nСлавься страна! Мы гордимся тобой!"],"c":[0]},{"q":"Какая дата объявлена Днем памяти сотрудников органов внутренних дел, погибших при выполнении служебных обязанностей?","o":["10 октября;","8 ноября;","22 июня;","9 декабря."],"c":[1]},{"q":"Каким нормативным правовым актом определяются приоритетные направления деятельности МВД России?","o":["Федеральным законом;","Указом Президента РФ;","Постановлением Правительства РФ;","Директивой МВД России."],"c":[3]},{"q":"Чувство неразрывной связи с народом, сознание ответственности за безопасность, процветание Родины, ее продвижение по пути исторического прогресса:","o":["Гражданственность;","Патриотизм;","Интернационализм;","Инфантилизм."],"c":[0]},{"q":"Согласно Кодексу этики и служебного поведения сотрудников органов внутренних дел Российской Федерации сотруднику мужского пола при выполнении служебных обязанностей рекомендуется:","o":["быть всегда коротко подстриженным, тщательно выбритым, в случае ношения усов и бороды следить за их аккуратным видом;","быть всегда коротко подстриженным и тщательно выбритым, допускается ношение усов и бороды;","быть всегда коротко подстриженным, тщательно выбритым, допускается ношение усов;","быть всегда коротко подстриженным и тщательно выбритым, в случае ношения усов следить за их аккуратным видом."],"c":[0]},{"q":"Назовите День воинской <script>
const DATA=JSON.parse(document.getElementById('data').textContent);

let S=window.claude?.hot?.data?.S || {screen:'home',mode:store.get('mode','learn'),sec:store.get('sec',0),limit:store.get('limit',0),shuffle:store.get('shuffle',true),autoShow:store.get('autoShow',false)};
window.claude?.hot?.snapshot?.(()=>({S}));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function plural(n,f){const m=n%10,h=n%100;return f[(m==1&&h!=11)?0:(m>=2&&m<=4&&(h<10||h>=20))?1:2]}
const lessonsOf=si=>{const n=DATA[si].qs.length,out=[];for(let i=0;i<n;i+=LSIZE)out.push([...Array(Math.min(LSIZE,n-i)).keys()].map(k=>i+k));return out};
const prog=()=>store.get('lessons',{});   // {"sec-lesson": best%}

/* "Все ответы верные" -> раскрыть, что именно верно */
const ALL=/^(все|оба)(?![а-я]).*(верн|правильн|вариант|перечисл|ответ|акты)|^все варианты/i;
const AB=/^(ответы\s+)?а\s+и\s+б(?![а-я])/i;
/* ---------- КЛЮЧЕВЫЕ СЛОВА: чем верный вариант отличается от неверных ---------- */
const STOP=new Set('и в во на с со по к ко о об от до из за для а или же при у то как что это его ее их также'.split(' '));
const WORD=/[0-9]+(?:[.,][0-9]+)*|[a-zа-яё№]+/gi;
const nw=s=>s.toLowerCase().replace(/ё/g,'е');
const toks=s=>(s.match(WORD)||[]).map(nw).filter(w=>!STOP.has(w));
const HCACHE=new Map();
function keyHint(q){
  if(HCACHE.has(q)) return HCACHE.get(q);
  const isMeta=t=>ALL.test(t)||AB.test(t)||/^нет верн/i.test(t);
  const out=q.c.map(ci=>{
    const ct=q.o[ci].trim();
    if(ALL.test(ct)) return {ci,type:'all'};
    if(AB.test(ct)) return {ci,type:'ab'};
    const C=[...new Set(toks(ct))];
    const wrongs=q.o.map((o,i)=>i).filter(i=>!q.c.includes(i)&&!isMeta(q.o[i].trim()));
    const W=wrongs.map(i=>new Set(toks(q.o[i])));
    let need=W.map((ws,k)=>({k,d:C.filter(t=>!ws.has(t))}));
    const extra=[];
    need.filter(n=>!n.d.length).forEach(n=>{const ex=[...W[n.k]].filter(t=>!C.includes(t));if(ex.length)extra.push(ex.slice(0,4))});
    need=need.filter(n=>n.d.length);
    const keys=[];
    while(need.length&&keys.length<4){
      const cnt={};need.forEach(n=>n.d.forEach(t=>cnt[t]=(cnt[t]||0)+1));
      const best=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||(/\d/.test(b)-/\d/.test(a))||b.length-a.length)[0];
      keys.push(best);need=need.filter(n=>!n.d.includes(best));
    }
    return {ci,type:'keys',keys,extra};
  });
  HCACHE.set(q,out);return out;
}
function kwHL(q,text){
  const h=keyHint(q).find(x=>q.o[x.ci]===text&&x.type==='keys');
  if(!h||!h.keys.length) return esc(text);
  const K=new Set(h.keys);
  return esc(text).replace(WORD,w=>K.has(nw(w))?`<mark class="kw">${w}</mark>`:w);
}
function hintHTML(q){
  const H=keyHint(q),lines=[];
  H.forEach(h=>{
    if(h.type==='all') lines.push('Все перечисленные пункты верны, поэтому правильный вариант — «'+esc(q.o[h.ci].trim().replace(/[.;]$/,''))+'».');
    else if(h.type==='ab') lines.push('Верны сразу оба варианта — А и Б.');
    else{
      if(h.keys.length) lines.push(`${h.keys.length>1?'Ключевые слова':'Ключевое слово'}: ${h.keys.map(k=>'<q>'+esc(k)+'</q>').join(' + ')} — по ${h.keys.length>1?'ним':'нему'} верный вариант отличается от неверных.`);
      h.extra.forEach(ex=>lines.push(`Ловушка: похожий неверный вариант добавляет лишнее — ${ex.map(k=>'<q>'+esc(k)+'</q>').join(', ')}.`));
    }
  });
  return lines.length?`<div class="tip"><span class="ti">Подсказка</span><div>${lines.join('<br>')}</div></div>`:'';
}
function answerParts(q){
  const parts=[];
  q.c.forEach(i=>{
    const t=q.o[i].trim();
    if(ALL.test(t)) parts.push({t, list:q.o.filter((o,j)=>j!==i && !/^нет верн/i.test(o.trim()))});
    else if(AB.test(t)) parts.push({t, list:[q.o[0],q.o[1]]});
    else parts.push({t});
  });
  return parts;
}

/* ---------- SEARCH ---------- */
const norm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[«»"“”„]/g,' ');
const INDEX=[];DATA.forEach((s,si)=>s.qs.forEach((q,qi)=>INDEX.push({si,qi,q:norm(q.q),o:norm(q.o.join(' '))})));
function stems(query){
  return norm(query).split(/[^a-zа-я0-9№]+/i).filter(w=>w.length>1||/\d/.test(w))
    .map(w=>w.length>5?w.slice(0,w.length-2):w);  // отрезаем окончания: "пистолета" ~ "пистолет"
}
function hl(text,st){
  let out=esc(text);
  if(!st.length) return out;
  const re=new RegExp('('+st.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')+')[а-яa-z]*','gi');
  // подсветка без учёта ё
  return out.replace(re,'<mark>$&</mark>');
}
function doSearch(query,sec){
  const st=stems(query); if(!st.length) return {st,res:[]};
  const res=[];
  for(const it of INDEX){
    if(sec!=null&&it.si!==sec) continue;
    let inQ=0,inAll=0;
    for(const w of st){ if(it.q.includes(w)){inQ++;inAll++} else if(it.o.includes(w)) inAll++; }
    if(inAll===st.length) res.push({...it,score:inQ*10+(it.q.startsWith(st[0])?5:0)});
  }
  res.sort((a,b)=>b.score-a.score||a.si-b.si||a.qi-b.qi);
  return {st,res};
}
function searchView(){

    <div class="sfilter" role="group" aria-label="Раздел">
      <button class="chip" data-f="" aria-pressed="${S.sfilter==null}">Все разделы</button>
      ${DATA.map((s,i)=>`<button class="chip" data-f="${i}" aria-pressed="${S.sfilter===i}">${esc(s.name)}</button>`).join('')}
    </div>

  </div>`;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;store.set('mode',S.mode);render()});
  const inp=app.querySelector('#q'),clr=app.querySelector('#clr');

function showResults(){
  const box=document.getElementById('res'),cnt=document.getElementById('cnt'); if(!box) return;
  const {st,res}=doSearch(S.query||'',S.sfilter);
  if(!st.length){cnt.textContent='';box.innerHTML='';return}
  if(!res.length){cnt.textContent='Ничего не найдено. Попробуйте ввести меньше слов или другое слово из вопроса.';box.innerHTML='';return}
  const MAX=40;
  cnt.textContent=`Найдено: ${res.length}${res.length>MAX?' — показаны первые '+MAX+', уточните запрос':''}`;
  box.innerHTML=res.slice(0,MAX).map(r=>{const q=DATA[r.si].qs[r.qi],parts=answerParts(q);
    return `<div class="ri">

}

function start(order,opts={}){
  const sec=DATA[S.sec];
  let ids=order||sec.qs.map((_,i)=>i);
  if(!order){ if(S.shuffle) ids=shuffle(ids); if(S.limit) ids=ids.slice(0,S.limit); }
  S={...S,screen:'quiz',order:ids,pos:0,answers:{},picked:[],retry:!!opts.retry,fromLesson:opts.fromLesson??null};
  render();window.scrollTo({top:0});
}
function counts(){let ok=0,bad=0;for(const k in S.answers){S.answers[k].ok?ok++:bad++}return{ok,bad}}
function quiz(){
  const sec=DATA[S.sec], qi=S.order[S.pos], q=sec.qs[qi], multi=q.c.length>1;
  const ans=S.answers[S.pos], done=!!ans, total=S.order.length, {ok,bad}=counts();
  const picked=done?ans.picked:S.picked;
  const label=S.fromLesson!=null?`${esc(sec.name)} · Проверка урока ${S.fromLesson+1}`:esc(sec.name);
  app.innerHTML=`
  <div class="bar">
    <div><div class="eyebrow">${label}</div></div>
    <div class="score num"><span class="ok">✓ ${ok}</span><span class="bad">✗ ${bad}</span><span>${S.pos+1} / ${total}</span></div>
  </div>

  <article class="card">
    <div class="qnum">ВОПРОС ${S.pos+1}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${multi&&!done?`<div class="hint">Здесь несколько правильных ответов — отметьте все и нажмите «Ответить».</div>`:''}
    <div class="opts">
      ${q.o.map((o,i)=>{
        let cls='',mark='';
        if(done){const isC=q.c.includes(i),isP=picked.includes(i);
          if(isC){cls='right';mark=isP?'Верно':'Правильный ответ'} else if(isP){cls='wrong';mark='Ваш ответ'} else cls='dim';}
        else if(picked.includes(i)) cls='sel';
        return `<button class="opt ${cls}" data-o="${i}" ${done?'disabled':''}><span class="key">${LET[i]}</span><span class="t">${done&&q.c.includes(i)?kwHL(q,o):esc(o)}</span>${mark?`<span class="mark">${mark}</span>`:''}</button>`}).join('')}
    </div>
    ${done?(ans.ok?`<div class="verdict ok"><b>Верно</b></div>`:`<div class="verdict bad"><b>Ошибка</b><span class="ans">Правильный ответ: ${esc(answerText(q))}</span></div>`)+hintHTML(q):''}
    <div class="foot">
      <button class="ghost" id="exit">${S.fromLesson!=null?'К урокам':'К разделам'}</button>
      <div class="row">
        <span class="kbd">${done?'Enter — дальше':'Клавиши 1–'+q.o.length+(multi?', Enter — ответить':'')}</span>
        ${done?`<button class="primary" id="next">${S.pos+1<total?'Следующий вопрос':'Результаты'}</button>`:(multi?`<button class="primary" id="submit" ${picked.length?'':'disabled'}>Ответить</button>`:'')}
      </div>
    </div>

  app.querySelector('#exit').onclick=()=>go(S.fromLesson!=null?'lessons':'home');

  }else{

  }

function choose(i){
  const q=DATA[S.sec].qs[S.order[S.pos]];
  if(q.c.length>1){const p=S.picked;S.picked=p.includes(i)?p.filter(x=>x!==i):[...p,i];render();return}
  S.picked=[i];submit();
}
function submit(){
  const q=DATA[S.sec].qs[S.order[S.pos]];
  if(!S.picked.length) return;
  const p=[...S.picked].sort(),c=[...q.c].sort();
  S.answers[S.pos]={picked:S.picked,ok:p.length===c.length&&p.every((v,i)=>v===c[i])};
  S.picked=[];render();
}
function next(){ if(S.pos+1<S.order.length){S.pos++;render();window.scrollTo({top:0})} else go('result') }
function result(){
  const sec=DATA[S.sec],{ok,bad}=counts(),total=S.order.length,pct=Math.round(ok/total*100);
  const isLesson=S.fromLesson!=null, L=lessonsOf(S.sec);
  if(!S.retry && !S.saved){

    else{const best=store.get('best',{});if(best[S.sec]==null||pct>best[S.sec]){best[S.sec]=pct;store.set('best',best)}}
    S.saved=true;
  }
  const wrong=Object.entries(S.answers).filter(([,a])=>!a.ok).map(([pos,a])=>({qi:S.order[pos],a}));
  const hasNext=isLesson&&S.fromLesson+1<L.length;
  app.innerHTML=`
  <header>
    <div class="eyebrow">${esc(sec.name)} · ${isLesson?'Урок '+(S.fromLesson+1)+' · проверка':'результат'}</div>

      <span class="big num" style="color:${pct>=80?'var(--ok)':pct>=60?'var(--accent)':'var(--bad)'}">${pct}%</span>
      <span>Верно <b class="num">${ok}</b> из <span class="num">${total}</span>, ошибок <b class="num">${bad}</b></span>
    </div>
    ${isLesson&&!S.retry?`<p class="lead">${pct>=80?'Урок пройден.':'Нужно не меньше 80%. Повторите карточки урока и пройдите проверку ещё раз.'}</p>`:''}
  </header>
  <div class="row">
    ${hasNext&&pct>=80?`<button class="primary" id="nextl">Следующий урок</button>`:''}
    ${wrong.length?`<button class="${hasNext&&pct>=80?'ghost':'primary'}" id="retry">Повторить ошибки (${wrong.length})</button>`:''}
    ${isLesson?`<button class="ghost" id="restudy">Повторить урок</button>`:`<button class="ghost" id="again">Пройти заново</button>`}
    <button class="ghost" id="home">${isLesson?'К урокам':'К разделам'}</button>
  </div>
  ${wrong.length?`<h2>Разбор ошибок</h2><div class="mist">${wrong.map(({qi,a})=>{const q=sec.qs[qi];return `<div class="mi">
    <div class="q">${esc(q.q)}</div>
    <div class="y">✗ Ваш ответ: ${esc(a.picked.map(i=>LET[i]+') '+q.o[i]).join('; '))}</div>
    <div class="c">✓ Правильно: ${esc(answerText(q))}</div></div>`}).join('')}</div>`:`<p class="lead">Без единой ошибки.</p>`}`;
  const r=app.querySelector('#retry'); if(r) r.onclick=()=>{S.saved=false;start(shuffle(wrong.map(w=>w.qi)),{retry:true,fromLesson:S.fromLesson})};
  const nl=app.querySelector('#nextl'); if(nl) nl.onclick=()=>{S.saved=false;go('study',{lesson:S.fromLesson+1,spos:0,shown:S.autoShow,others:false})};
  const rs=app.querySelector('#restudy'); if(rs) rs.onclick=()=>{S.saved=false;go('study',{lesson:S.fromLesson,spos:0,shown:S.autoShow,others:false})};
  const ag=app.querySelector('#again'); if(ag) ag.onclick=()=>{S.saved=false;start()};
  app.querySelector('#home').onclick=()=>{S.saved=false;go(isLesson?'lessons':'home')};
}
function render(){({home,lessons,study,quiz,result})[S.screen]()}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(document.activeElement&&document.activeElement.classList.contains('ghost')&&e.key==='Enter') return;
  if(S.screen==='study'){
    if(e.key==='Enter'||e.key===' '||e.key==='ArrowRight'){e.preventDefault(); S.shown?studyNext():(S.shown=true,render());}
    return;
  }
  if(S.screen!=='quiz') return;
  const done=!!S.answers[S.pos];
  if(e.key==='Enter'){e.preventDefault(); done?next():submit(); return;}
  const n=parseInt(e.key,10), q=DATA[S.sec].qs[S.order[S.pos]];
  if(!done&&n>=1&&n<=q.o.length) choose(n-1);
});
const boot=()=>render();
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
</script>
