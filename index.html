<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Контрольные тесты 2026</title>
<style>
/* Layout: one narrow working column; mode switch on top, the card as the only raised object. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#18212e; --muted:#5a6676; --line:#d5dbe3;
  --accent:#1d4f91; --accent-soft:#e3ebf6; --ok:#1d7a46; --ok-soft:#e2f3e8; --bad:#b42a2a; --bad-soft:#fbe6e4;
  --f-display:"PT Sans Caption","PT Sans",system-ui,sans-serif;
  --f-body:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151c; --surface:#18202b; --ink:#e6ebf2; --muted:#98a4b4; --line:#2b3644;
  --accent:#7ea8e6; --accent-soft:#1f2c3f; --ok:#5fc489; --ok-soft:#173226; --bad:#f08a80; --bad-soft:#3a1d1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#18202b; --ink:#e6ebf2; --muted:#98a4b4; --line:#2b3644;
  --accent:#7ea8e6; --accent-soft:#1f2c3f; --ok:#5fc489; --ok-soft:#173226; --bad:#f08a80; --bad-soft:#3a1d1c; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.75rem}
h2{font-size:1.2rem}
.eyebrow{font:700 .75rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* mode switch */
.search{display:flex;flex-direction:column;gap:12px}
.sbox{position:relative}
.sbox input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 44px 13px 14px}
.sbox input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.sbox .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:34px;height:34px;border-radius:6px;color:var(--muted);font-size:1.2rem}
.sfilter{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.scount{font-size:.9rem;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:10px}
.ri{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ri .rs{font:700 .72rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ri .rq{font-weight:700;white-space:pre-line}
.ri .ra{border-left:4px solid var(--ok);background:var(--ok-soft);border-radius:0 6px 6px 0;padding:8px 12px;white-space:pre-line}
.ri .ra b{color:var(--ok);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:2px}
.ri .ra ul{margin:4px 0 0;padding-left:20px}
mark{background:#ffe58a;color:#18212e;border-radius:2px;padding:0 1px}
mark.kw{background:#ffe58a;color:#18212e;font-weight:700;box-shadow:0 1px 0 #d9a400}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.95rem;color:var(--ink)}
.tip .ti{flex:none;font:700 .72rem/1.9 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.tip q{quotes:"«" "»";font-weight:700}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px}
.modes button{border:0;background:none;border-radius:8px;padding:10px 12px;font:700 1rem/1.2 var(--f-display);color:var(--muted);display:flex;flex-direction:column;gap:2px;align-items:center}
.modes button small{font:400 .78rem/1.2 var(--f-body)}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}

/* sections */
.sections{display:flex;flex-direction:column;gap:8px}
.sec{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.sec:hover{border-color:var(--accent)}
.sec[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.sec .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.sec[aria-pressed="true"] .radio{border-color:var(--accent)}
.sec[aria-pressed="true"] .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sec .name{font-weight:700;min-width:0}
.sec .meta{color:var(--muted);font-size:.85rem;font-weight:400}
.sec .count{color:var(--muted);font-size:.9rem;text-align:right;white-space:nowrap}
.minibar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px;max-width:220px}
.minibar i{display:block;height:100%;background:var(--ok)}
.settings{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-size:.92rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;border-radius:6px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.lbl{font-size:.9rem;color:var(--muted);margin-right:8px}
.primary{background:var(--accent);color:var(--surface);border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-family:var(--f-display)}
.primary:disabled{opacity:.45;cursor:default}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 16px}
.ghost:hover{border-color:var(--accent)}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:.92rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* lessons list */
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.lesson{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lesson:hover{border-color:var(--accent)}
.lesson .lt{font-weight:700;font-family:var(--f-display)}
.lesson .ls{font-size:.85rem;color:var(--muted)}
.lesson .lp{font-size:.82rem;font-weight:700}
.lesson.done{border-color:var(--ok)}
.lesson.done .lp{color:var(--ok)}
.lesson.part .lp{color:var(--accent)}
.lesson .first{font-size:.85rem;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* quiz + study */
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.score{display:flex;gap:14px;font-size:.92rem}
.score .ok{color:var(--ok)} .score .bad{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qnum{font:700 .8rem/1 var(--f-mono);color:var(--accent)}
.qtext{font-size:1.15rem;font-weight:700;margin:0;white-space:pre-line}
.hint{font-size:.88rem;color:var(--muted);margin-top:-8px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;white-space:pre-line}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt .key{font:700 .85rem/1.6 var(--f-mono);width:28px;height:24px;border-radius:5px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.opt .t{min-width:0}
.opt .mark{font-weight:700;font-size:.85rem;white-space:nowrap}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .key{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.right .mark{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
.verdict{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict b{font-family:var(--f-display)}
.verdict .ans{color:var(--ink);white-space:pre-line}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.kbd{font-size:.82rem;color:var(--muted)}

/* study card */
.answer{border-left:4px solid var(--ok);background:var(--ok-soft);border-radius:0 8px 8px 0;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.answer .al{font:700 .72rem/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.answer .at{font-size:1.12rem;font-weight:700;white-space:pre-line}
.answer ul{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:400;font-size:1rem}
.reveal{border:2px dashed var(--line);border-radius:10px;background:none;padding:22px;color:var(--muted);font-weight:700}
.reveal:hover{border-color:var(--accent);color:var(--accent)}
.others{font-size:.92rem;color:var(--muted)}
.others ul{margin:6px 0 0;padding-left:20px}
.others li{text-decoration:line-through;text-decoration-color:var(--bad);white-space:pre-line}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.seen{background:var(--accent)}
.dots i.cur{box-shadow:0 0 0 2px var(--accent)}

/* results */
.big{font:700 3rem/1 var(--f-display)}
.mist{display:flex;flex-direction:column;gap:10px}
.mi{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.mi .q{font-weight:700;white-space:pre-line}
.mi .y{color:var(--bad);white-space:pre-line} .mi .c{color:var(--ok);white-space:pre-line}
@media (max-width:480px){.kbd{display:none}h1{font-size:1.45rem}.card{padding:16px}.opt{grid-template-columns:26px 1fr}.opt .mark{grid-column:2}}
@media (prefers-reduced-motion:reduce){.progress i{transition:none}}
</style>
</head>

:["40 лет","60 лет","35 лет","45 лет"],"c":[2]},{"q":"Распространяется ли на сотрудников полиции действие трудового законодательства?","o":["не распространяется","распространяется в части, не урегулированной законодательством Российской Федерации, регламентирующим вопросы прохождения службы в органах внутренних дел, и настоящим Федеральным законом.","распространяется"],"c":[1]},{"q":"Не позднее какого срока налагаются взыскания за коррупционные правонарушения?","o":["не позднее шести месяцев со дня поступления информации о совершении сотрудником коррупционного правонарушения, не считая периодов временной нетрудоспособности сотрудника, нахождения его в отпуске или командировке, и не позднее трех лет со дня совершения им коррупционного правонарушения","не позднее девяти месяцев","не позднее трех месяцев","не позднее трех лет"],"c":[0]},{"q":"В какой форме выносится предупреждение, как мера административного наказания?","o":["В устной","В письменной","В устной или письменной","Не выностися"],"c":[1]},{"q":"Где подлежат опубликованию нормативные правовые акты Министерства внутренних дел Российской Федерации, признанные Министерством юстиции Российской Федерации не нуждающимися в государственной регистрации?","o":["публикуются в «Российской газете»","публикуются на различных интернет-ресурсах","публикуются в газете «Право и жизнь»","публикуются на «Официальном интернет-портале правовой информации» (  )"],"c":[3]},{"q":"Должны ли документ и каждое приложение к нему, содержащие служебную информацию, ограниченного распространения, иметь отдельные регистрационные номера?","o":["должны","должен только документ","не должны","должны только приложения"],"c":[0]},{"q":"В каком подразделении МВД России осуществляется формирование и ведение централизованного учета лиц, объявленных в федеральный розыск?","o":["ГИАЦ МВД России","Дежурная часть","ГУСБ МВД РФ","ФСБ РФ"],"c":[0]},{"q":"Кому принадлежит право законодательной инициативы согласно Конституции Российской Федерации?","o":["Президенту","Совету федерации","Верховному суду РФ","Все ответы верные"],"c":[3]},{"q":"На какой срок устанавливается испытание для граждан, поступающих на службу в органы внутренних дел?","o":["до 4 месяцев","от 2 до 6 месяцев","от полугода","на 6 месяцев"],"c":[1]},{"q":"Каким органом является Федеральное Собрание Российской Федерации?","o":["Законодательным","Исполнительным","Судебным"],"c":[0]},{"q":"Что в соответствии с Конституцией Российской Федерации не относится к ведению Российской Федерации?","o":["принятие и изменение Конституции Российской Федерации и федеральных законов, контроль за их соблюдением","федеральная государственная собственность и управление ею","государственные награды и почетные звания Российской Федерации","муниципальный бюджет"],"c":[3]},{"q":"Кем назначается на должность начальник территориального органа МВД России на районном уровне (за исключением должностей высшего начальствующего состава)?","o":["Руководителем соответствующего территориального органа МВД России на региональном уровне","Президентом","Министром внутренних дел","советом Федерации"],"c":[0]},{"q":"Виды дисциплинарных взысканий наложенных в письменной форме?","o":["замечание, предупреждение, выговор, строгий выговор, предупреждение о неполном служебном соответствии, перевод на нижестоящую должность в органах внутренних дел, увольнение со службы в органах внутренних дел.","замечание, предупреждение, строгое предупреждение, выговор, строгий выговор, предупреждение о неполном служебном соответствии, перевод на нижестоящую должность в органах внутренних дел, увольнение со службы в органах внутренних дел.","замечание, предупреждение, выговор, строгий выговор, предупреждение о неполном служебном соответствии, перевод на нижестоящую должность в органах внутренних дел, увольнение со службы в органах внутренних дел.","предупреждение, выговор, строгий выговор, предупреждение о неполном служебном соответствии, перевод на нижестоящую должность в органах внутренних дел, увольнение со службы в органах внутренних дел."],"c":[2]},{"q":"В какой срок полиция обязана пребывать на место происшествия?","o":["30 минут","15 минут","1 час","незамедлительно"],"c":[3]}]},{"name":"Огневая подготовка","qs":[{"q":"Стрельба прекращается самостоятельно:","o":["При появлении людей, машин или животных на мишенном поле, а также низколетящих летательных аппаратов над районом стрельбы;","При поднятии белого флага (фонаря белого света, открытии белых полукругов визуального сигнального устройства) на командном пункте;","При возникновении пожара, задержек при стрельбе, обнаружении неисправностей мишенного оборудования, а также иных обстоятельств, препятствующих выполнению упражнений стрельб;","Все ответы правильные."],"c":[3]},{"q":"Действия по команде «Магазин (магазины), ленту (ленты) снарядить»:","o":["Сотрудник снаряжает магазин необходимым количеством патронов и вставляет его в карман кобуры для запасного магазина (подсумок);","Сотрудник снаряжает магазин и убирает его в карман форменного обмундирования;","Сотрудник снаряжает магазин патронами согласно условиям выполнения упражнения, по указанию руководителя стрельб удерживает в руке или убирает в карман для запасного магазина кобуры (подсумок);","Сотрудник снаряжает магазин и присоединяет его в основание рукоятки пистолета."],"c":[2]},{"q":"Разрешается ли сотруднику поправлять и снимать противошумные наушники, защитные очки при наличии в руках оружия?","o":["Запрещается.","В зависимости от выполняемого упражнения.","Разрешается, если оружие разряжено.","Разрешается."],"c":[0]},{"q":"Вес пистолета Макарова со снаряженным магазином?","o":["1020 г.","900 г.","810 г.","715 г."],"c":[2]},{"q":"Обязан ли сотрудник доложить руководителю или помощнику руководителя стрельб о не израсходовании боеприпасов при выполнении упражнения, если по каким-либо причинам патрон или патроны оказались выброшенными из патронника?","o":["Да.","Только во время проведения контрольных стрельб.","Нет.","Только во время проведения учебных стрельб."],"c":[0]},{"q":"Безопасность при проведении стрельб обеспечивается:","o":["Высокой дисциплинированностью сотрудников и соблюдением ими требований настоящего Порядка.","Организацией стрельб в строгом соответствии с настоящим Порядком, четким и грамотным руководством проводимых мероприятий.","Исправностью оружия (боеприпасов), имитационных средств, полигонного, тирового и противопожарного оборудования, освещения, средств связи, средств усиления речи и передачи команд.","Все ответы правильные."],"c":[3]},{"q":"Действия при стрельбе из пистолета по команде «Осмотрено»:","o":["Сотрудник берет магазин в свободную от удержания пистолета руку, снимает затвор с затворной задержки (отпускает затворную раму), включает предохранитель (при его наличии), вставляет магазин в основание рукоятки, убирает пистолет в кобуру и застегивает ее;","Сотрудник берет магазин в свободную от удержания пистолета руку, снимает затвор с затворной задержки, производит спуск курка в направлении мишени, вставляет магазин в основание рукоятки, убирает пистолет в кобуру и застегивает ее;","Сотрудник берет магазин в свободную от удержания пистолета руку, вставляет его в основание рукоятки, снимает затвор с затворной задержки, производит спуск курка в направлении мишени, включает предохранитель (при его наличии), убирает пистолет в кобуру и застегивает ее;","Сотрудник, удерживая оружие дульной частью в сторону мишени, снимает затвор с затворной задержки (отпускает затворную раму), снимает с боевого взвода курок или деактивирует ударник нажатием на спусковой крючок, включает предохранитель (при его наличии), присоединяет (вставляет) пустой магазин (укладывает ленту в коробку, смыкает кассету с рукояткой), убирает оружие в кобуру."],"c":[3]},{"q":"В каком из ответов правильно перечислены основные части пистолета Макарова?","o":["Затвор с ударником, выбрасывателем и предохранителем; боевая пружина; рамка со стволом и спусковой скобой; ударно-спусковой механизм; рукоятка с винтом; затворная задержка; магазин, шплинт.","Рамка со стволом и спусковой скобой; возвратная пружина; затвор с ударником, выбрасывателем и предохранителем; ударно-спусковой механизм; рукоятка с винтом и антабкой; затворная задержка; магазин.","Рамка со стволом и спусковой скобой; антабка; затвор с ударником, выбрасывателем и предохранителем; возвратная пружина; ударно-спусковой механизм; рукоятка; затвор с задержкой и предохранителем; магазин.","Спусковой крючок, спусковая тяга с рычагом взвода, шептало с пружиной, курок, боевая пружина, задвижка боевой пружины."],"c":[1]},{"q":"Какие патроны (боеприпасы) запрещается использовать в закрытых тирах:","o":["Патроны (боеприпасы) с сердечником из твердых сплавов;","Боеприпасы, если пуля шатается в дульце гильзы;","Боеприпасы с бронебойно-зажигательными и трассирующими пулями;","Патроны (боеприпасы) имитационные, холостые."],"c":[2]},{"q":"Для чего служит рамка пистолета Макарова?","o":["Для соединения всех частей пистолета.","Для удобства удержания оружия в руках.","Для производства выстрела из пистолета.","Для крепления затвора."],"c":[0]},{"q":"Для чего предназначена рукоятка с винтом в пистолете Макарова?","o":["Заслоняет боковые окна и заднюю стенку основы рукоятки.","Служит для удобства удержания пистолета в деснице и носит декоративную функцию.","Прикрывает боковые окна и заднюю стенку основания рукоятки и служит для удобства удержания пистолета в руке.","Для маскировки."],"c":[2]},{"q":"Применяемые патроны для стрельбы из пистолета Макарова?","o":["9х17 мм.","9х18 мм.","9х19 мм.","9х21 мм."],"c":[1]},{"q":"В каком из ответов правильно и полно перечислены причины, по которым произошла осечка при стрельбе из пистолета Макарова?","o":["Неисправен капсюль патрона, не полностью ввинчен винт рукоятки.","Загрязнение канала под ударник, мал выход ударника или забоины на бойке, погнутость верхних краев корпуса магазина.","Сгущение смазки или загрязнение канала под ударником, неисправен капсюль патрона, мал выход ударника или забоины на бойке, не полностью ввинчен винт рукоятки.","Погнутость верхних краев магазина."],"c":[2]},{"q":"Сотрудник полиции имеет право лично или в составе подразделения (группы) применять огнестрельное оружие в следующем случае:","o":["Для пресечения попытки завладения огнестрельным оружием, транспортным средством полиции, специальной и боевой техникой, состоящими на вооружении (обеспечении) полиции;","Для пресечения административных правонарушений;","Для доставления в служебное помещение территориального органа или подразделения полиции лиц, совершивших административные правонарушения;","Для выявления лиц, совершающих или совершивших преступления или административные правонарушения."],"c":[0]},{"q":"Какие существуют способы устранения задержки «недокрытие патрона затвором» при стрельбе из пистолета Макарова?","o":["Выбросить прихваченную гильзу и продолжить стрельбу. При неисправности выбрасывателя с пружиной или отражателя отправить пистолет в мастерскую.","Перезарядить пистолет и продолжить стрельбу. Осмотреть и прочистить пистолет. Ввинтить винт рукоятки до отказа.","Дослать затвор вперед толчком руки и продолжить стрельбу. Осмотреть и прочистить пистолет.","Осмотреть и прочистить пистолет. Отправить пистолет в мастерскую."],"c":[2]},{"q":"В каком из ответов правильно изложены условия выполнения упражнения 5 из пистолета?","o":["Дистанция до цели 20 м., 4 патрона, время на выполнение 12 секунд.","Дистанция до цели 5 м., 4 патрона, время на выполнение 10 секунд.","Дистанция до цели 10 м., 4 патрона, время на выполнение 10 секунд.","Дистанция до цели 7 м., 4 патрона, время на выполнение 15 секунд."],"c":[2]},{"q":"Каким количеством пуль необходимо поразить зону поражения при выполнении упражнения 5 из пистолета, чтобы сотрудник, относящийся к усиленному уровню, был оценен «удовлетворительно»?","o":["Зона поражения поражена 4-мя пулями.","Зона поражения поражена 2-мя пулями.","Зона поражения поражена 3-мя пулями и более.","Зона поражения поражена 2-мя пулями и более."],"c":[2]},{"q":"Масса АКС74У со снаряженным магазином:","o":["2,5 кг;","2,7 кг;","2,9 кг;","3 кг."],"c":[3]},{"q":"Назначение АКС74У:","o":["Является индивидуальным оружием и предназначен для уничтожения живой силы и поражения огневых средств противника;","Является личным оружием нападения и защиты, предназначенным для поражения противника на коротких расстояниях;","Является оружием снайпера и предназначена для уничтожения различных появляющихся, движущихся, открытых и маскированных одиночных целей;","Является индивидуальным оружием и предназначен для уничтожения открытой живой силы, а также живой силы, находящейся в открытых окопах, траншеях и на обратных скатах местности."],"c":[0]},{"q":"Сотрудник полиции имеет право лично или в составе подразделения (группы) применять огнестрельное оружие в следующем случае:","o":["Для пресечения массовых беспорядков и иных противоправных действий, нарушающих движение транспорта, работу средств связи и организаций;","Для преодоления противодействия законным требованиям сотрудника полиции;","Для освобождения заложников;","Для пресечения административного правонарушения."],"c":[2]},{"q":"При проведении стрельб запрещается:","o":["Расчехлять оружие или извлекать его из кобуры по команде руководителя (помощника руководителя) стрельб;","Использовать оружие и патроны (боеприпасы), превышающие установленный класс броневой защиты стрелкового объекта;","Заряжать оружие боевыми или холостыми патронами по команде руководителя (помощника руководителя) стрельб;","Открывать и вести огонь по команде руководителя (помощника руководителя) стрельб."],"c":[1]},{"q":"Действия при стрельбе из пистолета по команде «Приготовиться к стрельбе»:","o":["Сотрудник извлекает пистолет из кобуры, вставляет снаряженный магазин в основание рукоятки и в зависимости от условий выполнения упражнения досылает патрон в патронник, или убирает пистолет в кобуру и застегивает ее;","Сотрудник осуществляет проверку оружия на незаряженность, готовит его к стрельбе, проверяет работу ударно-спускового механизма, производя несколько выстрелов вхолостую в сторону мишени, снимает с боевого взвода курок или деактивирует ударник нажатием на спусковой крючок в сторону мишени, включает предохранитель, убирает оружие в кобуру;","Сотрудник извлекает оружие из кобуры, опробует ударно-спусковой механизм оружия, производя несколько выстрелов «вхолостую» в направлении мишени, убирает оружие в кобуру;","Сотрудник извлекает оружие из кобуры, выключает предохранитель, отводит затвор в крайнее заднее положение и ставит его на затворную задержку, снимает затвор с затворной задержки, включает предохранитель и убирает оружие в кобуру."],"c":[1]},{"q":"Начальная скорость полета пули пистолета Макарова:","o":["315 м/c;","350 м/c;","730 м/c;","810 м/c."],"c":[0]},{"q":"При стрельбе из ручного стрелкового оружия:","o":["Запрещается касаться спускового крючка в момент прицеливания и ведения огня;","Запрещается передавать оружие и боеприпасы по команде руководителя стрельб;","Формировать хват и удерживать оружие способом, который может травмировать сотрудника;","Запрещается надевать противошумные наушники и защитные очки до команды «Заряжай»."],"c":[2]},{"q":"Действия при стрельбе из бесствольного (сигнального) пистолета по команде «Заряжай»:","o":["Сотрудник вставляет патрон (патроны) в канал ствола. Приводит положение оружия в соответствие с условием и порядком выполнения упражнения. Принимает положение для стрельбы и докладывает о готовности к стрельбе без указания специального звания, фамилии: \"К стрельбе готов\";","Сотрудник извлекает бесствольный (сигнальный) пистолет из кобуры, вставляет магазин в основание рукоятки, убирает пистолет в кобуру и застегивает ее;","Сотрудник, в зависимости от условий выполнения упражнения, снаряжает кассету боеприпасами и смыкает ее с рукояткой. Приводит положение оружия в соответствие с условием и порядком выполнения упражнения. Принимает положение для стрельбы и докладывает о готовности к стрельбе с указанием специального звания, фамилии: \"К стрельбе готов\";","Сотрудник снаряжает магазин патронами и удерживает его в руке и докладывает о готовности к стрельбе с указанием специального звания, фамилии: \"К стрельбе готов\"."],"c":[2]},{"q":"Назначение Пистолета Макарова:","o":["Является индивидуальным оружием и предназначен для уничтожения живой силы и поражения огневых средств противника;","Является личным оружием нападения и защиты, предназначенным для поражения противника на коротких расстояниях;","Является оружием снайпера и предназначена для уничтожения различных появляющихся, движущихся, открытых и маскированных одиночных целей;","Является индивидуальным оружием и предназначен для уничтожения открытой живой силы, а также живой силы, находящейся в открытых окопах, траншеях и на обратных скатах местности."],"c":[1]},{"q":"Противошумные наушники и защитные очки надеваются и поправляются:","o":["В паузах между выстрелами;","При отсутствии оружия в руках стреляющего;","При поднятии белого флага на командном пункте;","По команде «Стой, прекратить огонь»."],"c":[1]},{"q":"Принцип работы автоматики пистолета Макарова:","o":["Использование энергии пороховых газов при подвижном затворе;","Использование отдачи при длинном ходе ствола;","Использование отдачи свободного затвора;","Использование энергии пороховых газов, отводимых из канала ствола."],"c":[2]},{"q":"Назначение основания рукоятки пистолета Макарова:","o":["Для соединения всех частей пистолета;","Для крепления рукоятки, боевой пружины и для помещения магазина;","Для предохранения хвоста спускового крючка от нечаянного нажатия на него;","Для сообщения пуле вращательного движения."],"c":[1]},{"q":"Длина ствола пистолета Макарова:","o":["75 мм;","85 мм;","90 мм;","93 мм."],"c":[3]},{"q":"В каком из ответов правильно и полно перечислены причины, по которым произошел прихват (ущемление) гильзы затвором при стрельбе из пистолета Макарова?","o":["Загрязнение пазов подвижных частей пистолета.","Загрязнение подвижных частей пистолета, неисправность выбрасывателя, его пружины или отражателя.","Загрязнение канала под ударник, подвижных частей пистолета, магазина, неисправность рычага взвода.","Загрязнение затворной задержки."],"c":[1]},{"q":"В каком из ответов правильно и полно перечислены способы устранения задержки «Неподача или непродвижение патрона из магазина в патронник» при стрельбе из пистолета Макарова?","o":["Выбросить прихваченную гильзу и продолжать стрельбу, прочистить пистолет, заменить пистолет.","Перезарядить пистолет и продолжать стрельбу, прочистить пистолет и магазин, заменить неисправный магазин.","Перезарядить пистолет и продолжать стрельбу, отправить пистолет в мастерскую, заменить пистолет.","Сдать пистолет на склад вооружения."],"c":[1]},{"q":"В каком из ответов правильно изложены условия выполнения упражнения 7 из пистолета?","o":["Дистанция до цели 20 метров, 4 патрона, время на выполнение 12 секунд, положение для стрельбы: стоя.","Дистанция до цели 5 метров, 4 патрона, время на выполнение 10 секунд, положение для стрельбы: стоя.","Дистанция до цели 10 метров, 4 патрона, время на выполнение 12 секунд, положение для стрельбы: стоя и с колена.","Дистанция до цели 7 метров, 4 патрона, время на выполнение 15 секунд, положение для стрельбы: стоя."],"c":[0]},{"q":"Какая мишень используется при выполнении упражнения 5 из пистолета?","o":["Мишень № 10 с.","Мишень № 25а.","Мишень № 6в, 4с.","Мишень № 2в, 2б."],"c":[2]},{"q":"Дальность прямого выстрела из АКС74У по грудной фигуре:","o":["до 260 м;","до 300 м;","до 360 м;","до 400 м."],"c":[2]},{"q":"Принцип автоматического действия АКС74У:","o":["Использование энергии пороховых газов при подвижном затворе;","Использование отдачи при длинном ходе ствола;","Использование отдачи свободного затвора;","Использование энергии пороховых газов, отводимых из канала ствола в газовую камеру."],"c":[3]},{"q":"Если по каким-либо причинам патрон оказался выброшенным из патронника, то:","o":["Стрельбу следует прекратить;","Стрельбу следует продолжать до израсходования всех патронов, а по окончании стрельбы доложить руководителю стрельб о неизрасходовании патрона;","Стрельбу следует продолжать до израсходования всех патронов, а по окончании стрельбы поднять выброшенный патрон, зарядить им оружие и продолжить стрельбу;","Стрельбу следует прекратить, поднять выброшенный патрон, зарядить им оружие и продолжить стрельбу."],"c":[1]},{"q":"Действия при стрельбе из пистолета по команде «Заряжай»:","o":["Сотрудник снаряжает магазин патронами и вставляет его в карман кобуры для запасного магазина. Приводит положение оружия в соответствие с условием и порядком выполнения упражнения. Принимает положение для стрельбы и докладывает о готовности к стрельбе с указанием специального звания, фамилии: \"К стрельбе готов\";","Сотрудник извлекает пистолет из кобуры, вставляет снаряженный магазин в основание рукоятки пистолета, убирает пистолет в кобуру и застегивает ее;","Сотрудник снаряжает магазин патронами и удерживает его в руке и не докладывает о готовности к стрельбе с указанием специального звания, фамилии: \"К стрельбе готов\";","Сотрудник, в зависимости от условий выполнения упражнения, извлекая либо не извлекая (не полностью извлекая) пистолет из кобуры, вставляет магазин в основание рукоятки пистолета. Приводит положение оружия в соответствие с условием и порядком выполнения упражнения. Принимает положение для стрельбы и докладывает о готовности к стрельбе с указанием специального звания, фамилии: \"К стрельбе готов\"."],"c":[3]},{"q":"При стрельбе из ручного стрелкового оружия запрещается использовать боеприпасы, если:","o":["На гильзе имеются ржавчина, помятости или зеленый налет;","Пуля шатается в дульце гильзы;","Капсюль выступает выше поверхности дна гильзы или имеет повреждения;","Все ответы правильные."],"c":[3]},{"q":"Высота пистолета Макарова:","o":["161 мм;","126,75 мм;","126 мм;","161,75 мм."],"c":[1]},{"q":"Разрешение на выполнение упражнений стрельб дает:","o":["Руководитель стрельб;","Раздатчик боеприпасов;","Наблюдатель;","Руководитель (начальник) органа, организации, подразделения МВД России."],"c":[0]},{"q":"Действия при стрельбе из пистолета по команде «Огонь» («Вперед», «К бою»):","o":["Сотрудник извлекает пистолет из кобуры, выключает предохранитель, досылает патрон в патронник и ведет прицельный огонь. По окончании стрельбы сотрудник убирает палец со спускового крючка, удерживая оружие в руке в направлении мишени, становится лицом к мишени, снимает затвор с затворной задержки и включает предохранитель;","Сотрудник выдвигается на огневой рубеж, принимает положение для стрельбы, выключает предохранитель, досылает патрон в патронник, удерживая оружие дульной частью в сторону мишени, накладывает палец на спусковой крючок и приступает к выполнению упражнения. По окончании выполнения упражнения сотрудник убирает палец со спускового крючка, удерживает оружие дульной частью в сторону мишени и докладывает руководителю стрельб, называя свои специальное звание, фамилию: \"Стрельбу закончил\". Если по окончании стрельбы затвор пистолета не встал в крайнее заднее положение на затворную задержку, сотрудник самостоятельно ставит его на затворную задержку;","Сотрудник извлекает пистолет из кобуры, выключает предохранитель, досылает патрон в патронник и ведет прицельный огонь. По окончании стрельбы сотрудник убирает палец со спускового крючка, удерживая оружие в руке в направлении мишени;","Сотрудник извлекает пистолет из кобуры, выключает предохранитель, досылает патрон в патронник и ведет прицельный огонь. По окончании стрельбы сотрудник убирает палец со спускового крючка, удерживая оружие в руке в направлении мишени, становится лицом к мишени, снимает затвор с затворной задержки и докладывает руководителю стрельб не называя свои специальное звание, фамилию: \"Стрельбу закончил\"."],"c":[1]},{"q":"Укажите ответ, в котором правильно перечислены детали, входящие в ударно-спусковой механизм пистолета Макарова:","o":["Спусковой крючок, затворная задержка, боевая пружина, задвижка боевой пружины.","Курок, спусковой крючок, спусковая тяга с рычагом взвода, боевая пружина, шептало с пружиной, задвижка боевой пружины.","Спусковая тяга с рычагом взвода, ударник, курок, шептало с пружиной, спусковой крючок, боевая пружина, задвижка боевой пружины.","Шептало с пружиной, спусковой крючок, затворная задержка, курок, боевая пружина."],"c":[1]},{"q":"Назначение затвора пистолета Макарова:","o":["Для нанесения удара по ударнику и разбития капсюля;","Для удержания курка на боевом и предохранительном взводе;","Для спуска курка с боевого взвода и взведения курка при нажиме на хвост спускового крючка;","Для подачи патрона из магазина в патронник, запирания канала ствола при выстреле, удержания гильзы (извлечения патрона) и постановки курка на боевой взвод."],"c":[3]},{"q":"Назначение боевой пружины пистолета Макарова:","o":["Для спуска курка с боевого взвода и взведения курка при стрельбе самовзводом;","Для нанесения удара по ударнику;","Для приведения в действие курка, рычага взвода и спусковой тяги;","Для удержания курка на боевом и предохранительном взводе."],"c":[2]},{"q":"Масса пули пистолета Макарова:","o":["6,1 г;","8,1 г;","9 г;","10 г."],"c":[0]},{"q":"В каком из ответов правильно и полно перечислены причины, по которым произошла автоматическая стрельба из пистолета Макарова?","o":["Загрязнение патронника, пазов рамки и чашечки затвора, касание полочки уступа предохранителя зуба шептала, загрязнение подвижных частей пистолета.","Сгущение смазки или загрязнение частей ударно-спускового механизма, износ боевого взвода курка или носика шептала, ослабление или излом пружины шептала, касание полочки уступа предохранителя зуба шептала.","Загрязнение частей ударно-спускового механизма или разрежение смазки, износ зуба боевого взвода курка или носика шептала, загрязнение подвижных частей пистолета.","Неисправность боевой пружины, спусковой тяги, рычага взвода."],"c":[1]},{"q":"В каком из ответов правильно и полно перечислены причины, по которым произошла неподача или непродвижение патрона из магазина в патронник при стрельбе из пистолета Макарова?","o":["Погнутость верхних краев корпуса магазина, загрязнение магазина и подвижных частей пистолета.","Неисправность выбрасывателя, погнутость корпуса магазина, загрязнение пазов частей пистолета.","Загрязнение магазина пистолета, неисправность выбрасывателя и гнетка.","Неисправность боевой пружины, спусковой тяги, рычага взвода."],"c":[0]},{"q":"В каком из ответов правильно изложены условия выполнения упражнения 6 из пистолета?","o":["Дистанция до цели 20 метров, 4 патрона, время на выполнение 12 секунд, положение для стрельбы: стоя и с колена.","Дистанция до цели 5 метров, 4 патрона, время на выполнение 10 секунд, положение для стрельбы: стоя и с колена.","Дистанция до цели 10 метров, 4 патрона, время на выполнение 12 секунд, положение для стрельбы: стоя и с колена.","Дистанция до цели 7 метров, 4 патрона, время на выполнение 15 секунд, положение для стрельбы: стоя и с колена."],"c":[2]},{"q":"Из какого положения сотрудник выполняет упражнение 6 из пистолета?","o":["Положение для стрельбы: сидя.","Положение для стрельбы: стоя, лежа.","Положение для стрельбы: стоя, с колена.","Положение для стрельбы: лежа на спине, животе."],"c":[2]},{"q":"Начальная скорость полета пули АКС74У:","o":["535 м/c;","635 м/c;","735 м/c;","835 м/c."],"c":[2]},{"q":"Назначение крышки ствольной коробки АКС74У:","o":["Для предохранения частей и механизмов, помещенных в ствольную коробку, от загрязнения;","Для предохранения рук автоматчика от ожогов при стрельбе;","Для соединения частей и механизмов автомата, для обеспечения закрывания канала ствола затвором и запирания затвора;","Для удобства действия с автоматом при стрельбе."],"c":[0]},{"q":"Куда должно быть направлено оружие у сотрудника, находящегося на огневом рубеже, если он не ведет стрельбу?","o":["Вверх.","Вниз.","В сторону мишеней.","В сторону, где нет людей."],"c":[2]},{"q":"Действия при стрельбе из пистолета по команде «Разряжай, оружие к осмотру!»:","o":["Сотрудник, удерживая оружие дульной частью в сторону мишени, извлекает магазин из основания рукоятки пистолета, осматривает патронник оружия, удерживает патрон и (или) магазин в руке. Предъявляет их и патронник к осмотру руководителю стрельб;","Сотрудник, удерживая оружие в направлении мишени, выключает предохранитель, отводит затвор назад и ставит его на затворную задержку, снимает затвор с затворной задержки, извлекает магазин из основания рукоятки пистолета, вкладывает магазин под большой палец руки, удерживающей оружие, впереди предохранителя так, чтобы подаватель магазина был на 2–3 см выше затвора. Предъявляет их и патронник к осмотру руководителю стрельб;","Сотрудник, удерживая оружие в направлении мишени, выключает предохранитель, отводит затвор в крайнее заднее положение и ставит его на затворную задержку;","Сотрудник, удерживая оружие в направлении мишени, выключает предохранитель, извлекает магазин из основания рукоятки пистолета, вкладывает магазин под большой палец руки, удерживающей оружие, впереди предохранителя так, чтобы подаватель магазина был на 2–3 см выше затвора."],"c":[0]},{"q":"Разрешается ли сотруднику продолжать стрельбу, если по каким-либо причинам патрон оказался выброшенным из патронника?","o":["Нет.","В зависимости от выполняемого упражнения.","Да.","Только на контрольных стрельбах."],"c":[2]},{"q":"Длина пистолета Макарова:","o":["126 мм;","126,75 мм;","161 мм;","161,75 мм."],"c":[2]},{"q":"Укажите, как правильно разрядить оружие, из которого невозможно безопасно извлечь боеприпас:","o":["Оружие, из которого невозможно безопасно извлечь боеприпас, разряжается выстрелом в сторону мишени по команде руководителя стрельб;","Оружие, из которого невозможно безопасно извлечь боеприпас, разряжается руководителем стрельб самостоятельно на его усмотрение;","В случае если невозможно безопасно извлечь боеприпас, сотрудник включает предохранитель и передает оружие руководителю стрельб;","Оружие, из которого невозможно безопасно извлечь боеприпас, разряжается сотрудником под руководством руководителя стрельб."],"c":[0]},{"q":"Укажите правильные действия сотрудника по команде «Стой!»:","o":["При стрельбе из любого вида оружия сотрудник прекращает стрельбу, убирает палец со спускового крючка, включает предохранитель (при его наличии) и удерживает оружие дульной частью в сторону мишени.","При стрельбе из любого вида оружия сотрудник включает предохранитель и докладывает об окончании стрельбы.","При стрельбе из любого вида оружия сотрудник удерживает оружие дульной частью в сторону мишени и докладывает об окончании стрельбы.","При стрельбе из любого вида оружия сотрудник прекращает стрельбу."],"c":[0]},{"q":"Назначение шептала пистолета Макарова:","o":["Для приведения в действие курка, рычага взвода и спусковой тяги;","Для нанесения удара по ударнику;","Для удержания затвора в заднем положении по израсходовании всех патронов из магазина;","Для удержания курка на боевом и предохранительном взводе."],"c":[3]},{"q":"Укажите ответ, в котором правильно перечислено, из чего состоит 9-мм пистолетный патрон:","o":["Гильза, пороховой заряд, пуля;","Гильза, капсюль, пуля;","Гильза, капсюль, пороховой заряд, пуля;","Капсюль, пороховой заряд, пуля."],"c":[2]},{"q":"Расстояние, на котором сохраняется убойная сила пули пистолета Макарова:","o":["до 350 м;","до 50 м;","до 1000 м;","до 315 м."],"c":[0]},{"q":"Признак задержки «Прихват (ущемление) гильзы затвором» при стрельбе из пистолета Макарова:","o":["Затвор в крайнем переднем положении, курок спущен, но выстрела не произошло;","Затвор остановился, не дойдя до крайнего переднего положения, спуск курка произвести нельзя;","Затвор находится в переднем положении, но патрона в патроннике нет, либо затвор остановился в среднем положении вместе с патроном, не дослав его в патронник;","Гильза не выброшена наружу через окно в затворе и заклинилась затвором и казенным срезом ствола."],"c":[3]},{"q":"Сотрудник полиции имеет право применять огнестрельное оружие:","o":["Для производства предупредительного выстрела, подачи сигнала тревоги или вызова помощи путем производства выстрела вверх или в ином безопасном направлении;","Для выявления лиц, совершающих или совершивших преступления или административные правонарушения;","Для преодоления противодействия законным требованиям сотрудника полиции;","Для пресечения административных правонарушений."],"c":[0]},{"q":"Укажите ответ, в котором правильно перечислено, что входит в принадлежность к пистолету Макарова:","o":["Кобура, протирка, запасный магазин, пистолетный ремешок;","Кобура, протирка, 8 патронов, пистолетный ремешок;","Кобура, протирка, 16 патронов, пистолетный ремешок;","Кобура, протирка, 16 патронов, запасный магазин, пистолетный ремешок."],"c":[0]},{"q":"Укажите, какие упражнения из пистолета являются контрольными для сотрудников, относящихся к базовому уровню?","o":["Упражнения 4, 5 стрельб из пистолета.","Упражнения 5, 6 стрельб из пистолета.","Упражнения 5, 6 и 7 стрельб из пистолета.","Упражнения 5, 7 и 11 стрельб из пистолета."],"c":[1]},{"q":"Укажите, какие упражнения из автомата являются контрольными для сотрудников, относящихся к базовому уровню?","o":["Упражнение 5 стрельб из автомата.","Упражнение 6 стрельб из автомата.","Упражнение 7 стрельб из автомата.","Упражнение 10 стрельб из автомата."],"c":[0]},{"q":"Длина АКС74У с откинутым прикладом:","o":["490 мм;","590 мм;","730 мм;","830 мм."],"c":[3]},{"q":"Назначение ударно-спускового механизма АКС74У:","o":["Для досылания патрона в патронник, закрывания канала ствола, разбивания капсюля, и извлечения из патронника гильзы;","Для спуска курка с боевого взвода или со взвода автоспуска, нанесения удара по ударнику, обеспечения ведения автоматического или одиночного огня, прекращения стрельбы, для предотвращения выстрелов при незапертом затворе и для постановки автомата на предохранитель;","Для соединения частей и механизмов автомата, для обеспечения закрывания канала ствола затвором и запирания затвора;","Для приведения в действие затвора."],"c":[1]},{"q":"Сотрудник полиции имеет право применять огнестрельное оружие:","o":["Для выявления лиц, совершающих или совершивших преступления или административные правонарушения;","Для преодоления противодействия законным требованиям сотрудника полиции;","Для обезвреживания животного, угрожающего жизни и здоровью граждан и (или) сотрудника полиции;","Для пресечения административных правонарушений."],"c":[2]},{"q":"При проведении стрельб запрещается:","o":["Расчехлять оружие или извлекать его из кобуры по команде руководителя (помощника руководителя) стрельб;","Открывать и вести огонь по команде руковоителя (помощника руководителя) стрельб;","Заряжать оружие боевыми или холостыми патронами по команде руководителя (помощника руководителя) стрельб;","Открывать и вести огонь из оружия, в стволе которого имеются посторонние предметы."],"c":[3]},{"q":"Причина задержки «Автоматическая стрельба» при стрельбе из пистолета Макарова:","o":["Капсюль патрона неисправен;","Загрязнение патронника, пазов рамки и чашечки затвора;","Погнутость верхних краев корпуса магазина;","Износ боевого взвода курка или носика шептала."],"c":[3]},{"q":"Калибр ствола пистолета Макарова:","o":["7 мм;","8 мм;","9 мм;","9,1 мм."],"c":[2]},{"q":"Разрешается ли сотруднику открывать или вести огонь (гранатометание) при поднятом белом флаге (фонаре) на командном пункте тира, стрельбища или полигона?","o":["Запрещается.","Разрешается.","В зависимости от выполняемого упражнения.","Разрешается, если нет угрозы окружающим."],"c":[0]},{"q":"Могут ли сотрудники выполнять стрельбы из оружия, незакрепленного за ними?","o":["Нет.","Могут только с разрешения руководителя (помощника руководителя) стрельб.","Могут из оружия, которое специально получено для проведения стрельб.","Могут только с разрешения руководителя подразделения."],"c":[2]},{"q":"Назначение спусковой скобы пистолета Макарова:","o":["Для соединения всех частей пистолета;","Для крепления спускового крючка, боевой пружины и для помещения магазина;","Для предохранения хвоста спускового крючка от нечаянного нажатия на него;","Для сообщения пуле вращательного движения."],"c":[2]},{"q":"Имеет ли право сотрудник полиции, не прошедший проверку на профессиональную пригодность к действиям в условиях, связанных с применением огнестрельного оружия, выполнять обязанности, связанные с возможным его применением?","o":["Решение принимает руководитель стрельб.","Решение принимает руководитель подразделения.","Не имеет.","Имеет."],"c":[2]},{"q":"Назначение выбрасывателя пистолета Макарова:","o":["Для разбития капсюля;","Для удержания курка на боевом и предохранительном взводе;","Для удержания гильзы (патрона) в чашечке затвора до встречи с отражателем;","Для запирания канала ствола при выстреле."],"c":[2]},{"q":"Назначение подавателя магазина пистолета Макарова:","o":["Для соединения всех частей магазина;","Для подачи патронов;","Для возвращения затвора в переднее положение после выстрела;","Для помещения восьми патронов."],"c":[1]},{"q":"Боевая скорострельность пистолета Макарова:","o":["15 выстрелов в минуту;","20 выстрелов в минуту;","30 выстрелов в минуту;","50 выстрелов в минуту."],"c":[2]},{"q":"Признак задержки «Недокрытие патрона затвором» при стрельбе из пистолета Макарова:","o":["Затвор в крайнем переднем положении, курок спущен, но выстрела не произошло;","Затвор остановился, не дойдя до крайнего переднего положения, спуск курка произвести нельзя;","Затвор находится в переднем положении, но патрона в патроннике нет, либо затвор остановился в среднем положении вместе с патроном, не дослав его в патронник;","Гильза не выброшена наружу через окно в затворе и заклинилась затвором и казенным срезом ствола."],"c":[1]},{"q":"Назначение затворной задержки пистолета Макарова:","o":["Для приведения в действие курка, рычага взвода и спусковой тяги;","Для возвращения затвора в переднее положение после выстрела;","Для удержания затвора в заднем положении по израсходовании всех патронов из магазина;","Для удержания курка на боевом и предохранительном взводе."],"c":[2]},{"q":"Укажите, какие упражнения из пистолета являются контрольными для сотрудников, относящихся к усиленному уровню?","o":["Упражнения 4, 5 стрельб из пистолета.","Упражнения 5, 6 стрельб из пистолета.","Упражнения 5, 6 и 7 стрельб из пистолета.","Упражнения 5, 7 и 11 стрельб из пистолета."],"c":[2]},{"q":"Сколько времени отводится сотруднику на выполнение упражнения 5 из пистолета?","o":["5 секунд.","12 секунд.","10 секунд.","15 секунд."],"c":[2]},{"q":"Боевая скорострельность АКС74У при стрельбе очередями:","o":["100 выстрелов в минуту;","150 выстрелов в минуту;","200 выстрелов в минуту;","250 выстрелов в минуту."],"c":[0]},{"q":"Назначение затвора АКС74У:","o":["Для досылания патрона в патронник, закрывания канала ствола, разбивания капсюля, и извлечения из патронника гильзы;","Для спуска курка с боевого взвода или со взвода автоспуска, нанесения удара по ударнику, обеспечения ведения автоматического или одиночного огня, прекращения стрельбы, для предотвращения выстрелов при незапертом затворе и для постановки автомата на предохранитель;","Для соединения частей и механизмов автомата, для обеспечения закрывания канала ствола затвором и запирания затвора;","Для приведения в действие затвора и ударно-спускового механизма."],"c":[0]},{"q":"Сотруднику полиции запрещается применять огнестрельное оружие с производством выстрела на поражение в отношении:","o":["Несовершеннолетних, когда их возраст очевиден или известен сотруднику полиции;","Животного, угрожающего жизни и здоровью граждан и (или) сотрудника полиции;","Лица, оказывающего вооруженное сопротивление, а также лица, отказывающегося выполнить законное требование о сдаче находящихся при нем оружия, боеприпасов, взрывчатых веществ, взрывных устройств, ядовитых или радиоактивных веществ;","Лица, застигнутого при совершении деяния, содержащего признаки тяжкого или особо тяжкого преступления против жизни, здоровья или собственности, и пытающегося скрыться, если иными средствами задержать это лицо не представляется возможным."],"c":[0]},{"q":"Укажите, в каких случаях сотрудник полиции имеет право лично или в составе подразделения (группы) применять огнестрельное оружие?","o":["Вооруженное сопротивление, а также лица, отказывающегося выполнить законное требование о сдаче находящихся при нем оружия, боеприпасов, взрывчатых веществ, взрывных устройств, ядовитых или радиоактивных веществ;","Неповиновение, а также лица, отказывающегося выполнить законное требование о сдаче находящихся при нем оружия, боеприпасов, взрывчатых веществ, взрывных устройств, ядовитых или радиоактивных веществ;","Вооруженное сопротивление, или отказывающегося выполнить иные законные требования сотрудника полиции;","Сопротивление, а также лица, отказывающегося выполнить законное требование о сдаче находящихся при нем оружия, боеприпасов, взрывчатых веществ, взрывных устройств, химических или радиоактивных веществ."],"c":[0]},{"q":"Необходимо ли уведомлять близких родственников или близких лиц гражданина о причинении ему телесных повреждений в результате применения сотрудником полиции огнестрельного оружия?","o":["Да, в возможно короткий срок, но не более 24 час.","Родственники или близкие лица не уведомляются.","Да, только при наступлении смерти гражданина.","Уведомляются не позднее 72 час."],"c":[0]},{"q":"Что обязан сделать сотрудник полиции перед применением огнестрельного оружия, кроме случаев, когда промедление в его применении создает непосредственную угрозу жизни и здоровью гражданина или сотрудника полиции либо может повлечь иные тяжкие последствия?","o":["Сообщить о том, что он является сотрудником полиции, и предоставить им возможность для выполнения законных требований сотрудника полиции;","Сообщить лицам, в отношении которых предполагается применение огнестрельного оружия, о своем намерении, и предоставить им возможность и время для выполнения законных требований сотрудника полиции;","Сообщить лицам, в отношении которых предполагается применение огнестрельного оружия, о том, что он является сотрудником полиции, предупредить их о своем намерении и предоставить им возможность и время для выполнения законных требований сотрудника полиции;","Сообщить лицам, в отношении которых предполагается применение огнестрельного оружия, о том, что он является сотрудником полиции, предупредить их о своем намерении и предоставить им возможность добровольной выдачи находящихся при них предметов и веществ, запрещенных к гражданскому обороту."],"c":[2]},{"q":"Разрешается ли стрельба из оружия с использованием патронов с сердечником из твердых сплавов по металлическим мишеням?","o":["Не разрешается.","Разрешается, если расстояние до цели не менее 10 метров.","Разрешается.","Разрешается, если сотрудник в защитных очках."],"c":[1]},{"q":"Разрешается ли использовать боеприпасы, если на них имеется ржавчина, помятости или зеленый налет?","o":["Не разрешается.","Разрешается.","Разрешается, если сотрудник не нарушает меры безопасности.","Разрешается наиболее подготовленным сотрудникам."],"c":[0]},{"q":"Как передается пистолет сотруднику, за которым оружие не закреплено, на исходном рубеже по команде руководителя (помощника руководителя) стрельб?","o":["Передает оружие пистолетной рукояткой вниз;","Передает оружие дульной частью назад;","Передает оружие дульной частью под 45°;","Передает незаряженное оружие с включенным предохранителем пистолетной рукояткой вперед, дульная часть должна быть направлена вертикально вниз."],"c":[3]},{"q":"К какому уровню профессиональной служебной и физической подготовки относятся сотрудники полиции, за исключением отдельных категорий?","o":["Базовый.","Усиленный.","Специальный.","Специальный профессиональный уровень."],"c":[1]},{"q":"С какой периодичностью организуются и проводятся учебные стрельбы из пистолета для сотрудников, относящихся к усиленному уровню?","o":["Не реже 1 раза в две недели.","Не реже 1 раза в месяц.","Не реже 3 раз в месяц.","Не реже 3 раз в квартал."],"c":[0]},{"q":"Какие упражнения из автомата являются контрольными для сотрудников, относящихся к усиленному уровню?","o":["Упражнение № 7.","Упражнение № 1.","Упражнение № 5.","Упражнение № 3."],"c":[0]},{"q":"Для чего предназначены целик и мушка пистолета Макарова?","o":["Для удобства удержания оружия.","Для уменьшения веса пистолета.","Для прицеливания.","Нет правильного ответа."],"c":[2]},{"q":"Какой калибр ствола автомата АК-74?","o":["9 мм.","5,45 мм.","7,62 мм.","5,56 мм."],"c":[1]},{"q":"Какие применяются патроны для стрельбы из пистолета-пулемета ПП-91 «Кедр»?","o":["7,62×25 мм.","5,45×25 мм.","9×19 мм.","9×18 мм."],"c":[3]},{"q":"Какие применяются патроны для стрельбы из ручного пулемета Калашникова?","o":["9×18 мм.","9×19 мм.","7,62×39 мм и 5,45×39 мм.","12,7×108 мм."],"c":[2]},{"q":"В каком случае сотрудник полиции имеет право обнажить огнестрельное оружие и привести его в готовность?","o":["Есть достаточно оснований для его использования.","Есть основания полагать, что сотруднику полиции угрожает опасность.","В создавшейся обстановке могут возникнуть основания для его применения, предусмотренные ФЗ «О полиции».","Если есть основания полагать, что злоумышленник может оказать сопротивление либо быть вооруженным."],"c":[2]},{"q":"Необходимо ли уведомлять прокурора о случаях причинения гражданину ранения либо наступления его смерти в результате применения сотрудниками полиции огнестрельного оружия?","o":["Необходимо в течение 24 час.","Не уведомляется.","Уведомляется только при наступлении смерти гражданина.","Необходимо не позднее 72 час."],"c":[0]},{"q":"Имеет ли право сотрудник полиции применить служебное огнестрельное оружие для обезвреживания животного, угрожающего жизни и здоровью граждан?","o":["Да, в соответствии с п. 2 ч. 3 ст. 23 ФЗ №3 «О полиции».","Нет, не имеет.","Да, имеет, если причинен вред жизни и здоровью гражданина.","Да, имеет, если животное бесхозное."],"c":[0]},{"q":"Разрешается ли использовать боеприпасы, если капсюль выступает выше поверхности дна гильзы или имеет повреждения?","o":["Разрешается.","Не разрешается.","Разрешается, если капсюль не деформирован.","Разрешается, если гильза не имеет зеленого налета."],"c":[1]},{"q":"Разрешается ли сотруднику самостоятельно расчехлять (извлекать) оружие в тире, на стрельбище или полигоне?","o":["Не разрешается.","Разрешается.","Разрешается в зависимости от условий упражнения.","Разрешается только на открытом стрельбище."],"c":[0]},{"q":"Разрешается ли сотруднику, выполняющему упражнения стрельб, касаться спускового крючка оружия при смене положения для стрельбы?","o":["Разрешается, если это не повлечет нарушения мер безопасности.","Не разрешается.","Разрешено, кроме прыжков и кувырков.","Разрешено, если оружие направлено в сторону мишени."],"c":[1]},{"q":"Какой порядок действий сотрудника при возникновении задержек при стрельбе?","o":["Докладывает руководителю.","Возвращается на исходный рубеж для самостоятельного устранения задержки.","Производит выстрел самовзводом.","Сотрудник убирает палец со спускового крючка и, удерживая оружие дульной частью в сторону мишени, включает предохранитель (по возможности и при его наличии), поднимает свободную от удержания оружия руку и докладывает руководителю стрельб о задержке."],"c":[3]},{"q":"Какая периодичность организации и проведения учебных стрельб из автомата для сотрудников, относящихся к базовому уровню?","o":["Не реже одного раза в три месяца.","Ежемесячно.","Не реже одного раза в 6 месяцев.","Не реже одного раза в год."],"c":[2]},{"q":"Сколько времени предусмотрено на самостоятельную работу по теоретическому разделу огневой подготовки сотрудникам, относящимся к базовому уровню?","o":["Не более 10 часов.","Не более 20 часов.","Не более 5 часов.","Не более 15 часов."],"c":[2]},{"q":"Для чего предназначен магазин пистолета Макарова?","o":["Для помещения восьми патронов.","Для досылания патрона в патронник.","Для выброса стреляной гильзы.","Для хранения патронов в укупорках."],"c":[0]},{"q":"Какой калибр у гранатомета ГП-25 (подствольны
